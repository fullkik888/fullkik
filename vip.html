<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK - Creator Profile</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff; --success: #34c759;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration:none;}
        
        .nav-tabs { display: flex; gap: 30px; align-items: center; overflow-x: auto; scrollbar-width: none; white-space:nowrap;}
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; text-decoration:none;}
        .nav-tab:hover { color: white; }

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        
        /* CREATOR PROFILE UI */
        .creator-banner { background: linear-gradient(135deg, #1c1010 0%, #0b0b0b 100%); border-radius: 20px; padding: 40px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-wrap:wrap; gap:20px;}
        .c-pic { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--card-bg); background:#1a0f0f;}
        .c-badge { display:inline-block; background:rgba(255, 204, 0, 0.1); color:#ffcc00; border:1px solid #ffcc00; font-size:12px; font-weight:bold; padding:2px 8px; border-radius:12px;}
        
        .c-wechat-pill { display:inline-flex; align-items:center; gap:5px; background:rgba(52,199,89,0.1); border:1px solid rgba(52,199,89,0.3); color:var(--success); padding:6px 12px; border-radius:20px; font-size:13px; margin-top:10px; cursor:pointer;}
        .c-wechat-pill:hover { background:rgba(52,199,89,0.2); }

        .btn-follow { background: var(--token); color: black; border: none; padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; display:flex; align-items:center; gap:5px;}
        .btn-follow.following { background: transparent; border:1px solid var(--text-muted); color: var(--text-muted); }
        .btn-share { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 20px; cursor: pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;}
        .btn-share:hover { background: rgba(255,255,255,0.1); }

        /* TABS */
        .vip-tabs { display: flex; gap: 30px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
        .vip-tab { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 0; outline: none; font-weight:bold;}
        .vip-tab.active { color: var(--accent-light); }

        /* LISTS */
        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; margin-bottom:10px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }

        #globalLoader { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px); z-index:999999; align-items:center; justify-content:center; flex-direction:column;}
        
        @media (max-width: 768px) {
            .header-top { padding: 15px 20px; }
            .creator-banner { flex-direction:column; text-align:center; }
        }
    </style>
</head>
<body>

<div id="globalLoader"><div style="font-size:16px; margin-bottom:15px; color:var(--accent-light); font-weight:bold; letter-spacing:1px; animation: pulseFade 1s infinite;" id="gLoadText">正在处理...</div></div>
<div id="toast" class="toast"></div>

<div class="header-top">
    <a href="/music.html" class="logo-container" id="logoText">FULLKIK</a>
    <div class="nav-tabs" id="mainNavTabs">
        <a href="/music.html" class="nav-tab">首页</a>
    </div>
    <div class="header-right">
        <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / CN</div>
    </div>
</div>

<div class="container">
    <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; gap:5px; margin-bottom:20px;" onclick="window.history.back();">
        <svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 返回 (Back)
    </button>

    <div class="creator-banner">
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center;">
            <img src="" class="c-pic" id="vipPfp">
            <div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                    <h2 style="margin:0; font-size:32px;" id="vipName">Username</h2>
                    <div class="c-badge" id="vipRoleBadge">VIP</div>
                </div>
                <div style="color:var(--text-muted); font-size:14px;"><span id="vipSongCount">0</span> 首上传歌曲 &nbsp;|&nbsp; <span id="vipFollowerCount">0</span> 人关注</div>
                <div class="c-wechat-pill" id="vipWechatPill" style="display:none;" onclick="copyWechat()">
                    <svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M8.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S9.1,13.5,8.5,13.5z M12.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1 S13.1,13.5,12.5,13.5z M20,10.5c0-4.1-4-7.5-9-7.5s-9,3.4-9,7.5c0,2.3,1.3,4.4,3.4,5.7l-0.9,2.8l3.2-1.6 c1.1,0.3,2.2,0.5,3.4,0.5C16,18,20,14.6,20,10.5z"/></svg> 微信: <span id="vipWechatText"></span> 
                    <svg viewBox="0 0 24 24" style="width:14px;fill:currentColor;margin-left:5px;"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </div>
            </div>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-follow" id="btnFollow" onclick="toggleFollow()">+ 关注</button>
            <button class="btn-share" onclick="copyProfileLink()"><svg viewBox="0 0 24 24" style="width:20px;fill:currentColor;"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></button>
        </div>
    </div>

    <div style="margin-top:40px;">
        <h3 style="margin:0 0 20px 0;">上传作品</h3>
        <div class="vip-tabs">
            <button class="vip-tab active" onclick="renderSongs('NEW')" id="tab-NEW">新作品</button>
            <button class="vip-tab" onclick="renderSongs('HOT')" id="tab-HOT">热门</button>
        </div>
        <div id="songList"></div>
    </div>
</div>

<script>
    const API_URL = '/api';
    const username = localStorage.getItem('djUsername');
    let targetUser = null; let creatorSongs = []; let userPurchases = [];
    
    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.className = 'toast'; if(isError) t.style.borderColor = 'var(--danger)'; t.innerHTML = `<span style="color:${isError ? 'white' : 'var(--accent)'}; font-weight:bold;">${isError ? '!' : '✓'}</span> ${msg}`; t.classList.add('show'); setTimeout(() => {t.classList.remove('show'); t.style.borderColor = 'var(--border-color)';}, 3500); }

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('u');
        if(!targetUsername) return window.location.href = '/music.html';

        try {
            const setRes = await fetch(`${API_URL}/settings`);
            if(setRes.ok) { const settings = await setRes.json(); if(settings.headerTitle) document.getElementById('logoText').innerText = settings.headerTitle; } 

            const uRes = await fetch(`${API_URL}/users/${targetUsername}`);
            if(!uRes.ok) return window.location.href = '/music.html';
            targetUser = await uRes.json();

            document.getElementById('vipPfp').src = targetUser.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            document.getElementById('vipName').innerText = targetUser.djName || targetUser.username;
            document.getElementById('vipRoleBadge').innerText = targetUser.role === 'PRODUCER' ? '制作人' : 'VIP';
            document.getElementById('vipFollowerCount').innerText = (targetUser.followers || []).length;
            
            if(targetUser.wechatPublic && targetUser.wechat) {
                document.getElementById('vipWechatPill').style.display = 'inline-flex';
                document.getElementById('vipWechatText').innerText = targetUser.wechat;
            }

            if(username) {
                const myRes = await fetch(`${API_URL}/users/${username}`);
                if(myRes.ok) {
                    const myData = await myRes.json();
                    userPurchases = myData.purchases || [];
                    const following = myData.following || [];
                    if(following.includes(targetUser.username)) {
                        const btn = document.getElementById('btnFollow');
                        btn.innerText = '已关注'; btn.classList.add('following');
                    }
                }
            }

            const allSongsReq = await fetch(`${API_URL}/songs`);
            const allSongs = await allSongsReq.json();
            creatorSongs = allSongs.filter(s => s.uploader === targetUser.username && s.status === 'APPROVED');
            document.getElementById('vipSongCount').innerText = creatorSongs.length;

            renderSongs('NEW');
        } catch(e) { console.error(e); }
    }

    function renderSongs(mode) {
        document.getElementById('tab-NEW').classList.remove('active'); document.getElementById('tab-HOT').classList.remove('active');
        document.getElementById(`tab-${mode}`).classList.add('active');

        let sorted = [...creatorSongs];
        if(mode === 'NEW') sorted.sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        else sorted.sort((a,b) => (b.downloads||0) - (a.downloads||0));

        const listDiv = document.getElementById('songList'); listDiv.innerHTML = '';
        if(sorted.length === 0) { listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无上传作品</div>`; return; }

        sorted.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            const isPurchased = userPurchases.some(p => p.songId === s.id);
            let priceHtml = isPurchased ? `<div style="color:var(--success); font-size:12px; border:1px solid var(--success); padding:2px 8px; border-radius:12px; white-space:nowrap;">已购买</div>` : (s.price === 0 ? `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">免费下载</div>` : `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price}</div>`);

            listDiv.innerHTML += `
                <div class="list-song-row" onclick="window.location.href='/music.html?songId=${s.id}'">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">👑 ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px; flex-shrink:0;">${priceHtml}</div>
                </div>
            `;
        });
    }

    async function toggleFollow() {
        if(!username) return window.location.href = '/register.html';
        const res = await fetch(`${API_URL}/users/${username}/follow`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ targetUser: targetUser.username }) });
        if(res.ok) {
            const data = await res.json();
            const btn = document.getElementById('btnFollow');
            if(data.following.includes(targetUser.username)) { btn.innerText = '已关注'; btn.classList.add('following'); }
            else { btn.innerText = '+ 关注'; btn.classList.remove('following'); }
            document.getElementById('vipFollowerCount').innerText = data.followersCount;
        }
    }

    function copyWechat() { navigator.clipboard.writeText(targetUser.wechat); showToast("微信号已复制 (WeChat ID Copied)"); }
    function copyProfileLink() { navigator.clipboard.writeText(window.location.href); showToast("主页链接已复制 (Link Copied)"); }

    let currentLang = localStorage.getItem('djLang') || 'cn';
    function toggleLang() { currentLang = currentLang === 'en' ? 'cn' : 'en'; localStorage.setItem('djLang', currentLang); }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
