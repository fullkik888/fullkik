<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK - DJ Profile</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* HEADER */
        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration:none;}
        .nav-tabs { display: flex; gap: 30px; align-items: center; overflow-x:auto; white-space:nowrap; scrollbar-width:none;}
        .nav-tabs::-webkit-scrollbar { display:none; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; text-decoration:none;}
        .nav-tab:hover { color: white; }
        .nav-tab.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .lang-toggle { font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); transition: 0.2s; flex-shrink:0;}
        .lang-toggle:hover { color: white; border-color: white;}

        .header-right { display: flex; align-items: center; gap: 15px; }
        .profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 30px; cursor: pointer; transition: 0.2s; text-decoration: none;}
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }
        .token-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; color: var(--token); border: 1px solid var(--border-color); text-decoration:none;}
        .token-pill:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        
        .profile-banner { background: linear-gradient(135deg, #1c1010 0%, #0b0b0b 100%); border-radius: 20px; padding: 40px; display: flex; align-items: center; justify-content:space-between; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .profile-pic-large-wrap { position: relative; width: 100px; height: 100px; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex-shrink:0; border:2px solid var(--accent);}
        .profile-pic-large-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .follow-btn { background: var(--accent); color: white; border: none; padding: 8px 24px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; display:flex; align-items:center; justify-content:center;}
        .follow-btn:hover { background: var(--accent-light); }
        .follow-btn.following { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-muted); }

        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; margin-bottom: 10px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }

        /* 3-Dot Loader for VIP Page */
        .vip-loader-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 99999; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .vip-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-light); animation: bounce 0.5s infinite alternate ease-in-out; }
        .vip-dot:nth-child(1) { animation-delay: 0s; }
        .vip-dot:nth-child(2) { animation-delay: 0.2s; }
        .vip-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0% { transform: scale(1); } 100% { transform: scale(1.5); } }

        @media (max-width: 768px) {
            .header-top { padding: 15px 20px; }
            .nav-tabs { gap: 15px; }
            .profile-banner { flex-direction:column; align-items:center; text-align:center; gap:20px;}
        }
    </style>
</head>
<body>

<div class="vip-loader-overlay" id="vipLoaderOverlay">
    <div class="vip-dot"></div>
    <div class="vip-dot"></div>
    <div class="vip-dot"></div>
</div>

<div class="header-top">
    <a href="/music.html" class="logo-container">FULLKIK</a>
    <div class="nav-tabs" id="mainNavTabs">
        <a href="/music.html" class="nav-tab">首页</a>
        <a href="/music.html" class="nav-tab">排行榜</a>
        <a href="/profile.html?view=library" class="nav-tab">我的音乐</a>
        <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / CN</div>
    </div>
    <div class="header-right">
        <div style="position:relative; display:flex; align-items:center; gap:10px;">
            <a href="/profile.html" class="token-pill" id="tokenUI">💎 <span id="tokenDisplay">0</span></a>
            <a href="/profile.html" class="profile-trigger" id="profileBtn"></a>
        </div>
    </div>
</div>

<div class="container">
    <div class="profile-banner">
        <div style="display:flex; align-items:center; gap:30px; flex-wrap:wrap; justify-content:center;">
            <div class="profile-pic-large-wrap">
                <img id="vipPfp" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E">
            </div>
            <div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <h2 id="vipName" style="margin:0; font-size:32px;">Loading...</h2>
                    <span id="roleLabel" style="display:none; color:#ffcc00; font-size:12px; font-weight:bold; border:1px solid #ffcc00; padding:2px 6px; border-radius:10px;">VIP</span>
                </div>
                <div id="vipWechat" style="color:#34c759; font-size:13px; margin-top:8px; display:flex; align-items:center; gap:5px;"></div>
                <div style="color:var(--text-muted); margin-top:5px; font-size:14px;"><span id="vipSongCount">0</span> 首上传歌曲 | <span id="vipFollowCount">0</span> 人关注</div>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="follow-btn" id="followBtn" onclick="toggleFollow()">关注</button>
            <button class="follow-btn following" onclick="alert('链接已复制')">🔗 分享</button>
        </div>
    </div>

    <h3 style="margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">新作品</h3>
    <div id="vipSongsList"></div>
</div>

<script>
    const API_URL = '/api';
    const username = localStorage.getItem('djUsername');
    let targetUser = '';
    let isFollowing = false;
    let myFollowingList = [];

    async function init() {
        if(username) {
            const meRes = await fetch(`${API_URL}/users/${username}`);
            if(meRes.ok) {
                const me = await meRes.json();
                document.getElementById('tokenDisplay').innerText = me.tokens || 0;
                document.getElementById('profileBtn').innerHTML = `<img class="profile-pic" src="${me.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E"}">`;
                myFollowingList = me.following || [];
            }
        } else {
            document.getElementById('tokenUI').style.display = 'none'; 
            document.getElementById('profileBtn').outerHTML = `<button class="btn-upgrade-top" onclick="window.location.href='/register.html'">登录</button>`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        targetUser = urlParams.get('user');
        if(!targetUser) return document.body.innerHTML = '<h2 style="margin-top:100px; text-align:center;">User Not Found</h2>';

        // Load Nav Genres
        const genres = await (await fetch(`${API_URL}/genres`)).json();
        const nav = document.getElementById('mainNavTabs');
        const homeNode = nav.children[0];
        genres.filter(g => g.status !== 'DISABLED').slice(0, 3).forEach(g => {
            const btn = document.createElement('a'); btn.className = 'nav-tab'; btn.innerText = g.name; btn.href = `/music.html`;
            nav.insertBefore(btn, homeNode.nextSibling);
        });

        // Load VIP Details
        const res = await fetch(`${API_URL}/users/${targetUser}`);
        if(res.ok) {
            const vData = await res.json();
            document.getElementById('vipName').innerText = vData.djName || vData.username;
            document.getElementById('vipPfp').src = vData.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            
            if(vData.isVip || vData.role === 'PRODUCER') {
                const rl = document.getElementById('roleLabel');
                rl.innerText = vData.role === 'PRODUCER' ? 'PRODUCER' : 'VIP';
                rl.style.display = 'inline-block';
            }

            if(vData.wechatPublic && vData.wechat) {
                document.getElementById('vipWechat').innerHTML = `<svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M8.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S9.1,13.5,8.5,13.5z M12.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1 S13.1,13.5,12.5,13.5z M20,10.5c0-4.1-4-7.5-9-7.5s-9,3.4-9,7.5c0,2.3,1.3,4.4,3.4,5.7l-0.9,2.8l3.2-1.6 c1.1,0.3,2.2,0.5,3.4,0.5C16,18,20,14.6,20,10.5z"/></svg> 微信: ${vData.wechat}`;
            }
            document.getElementById('vipFollowCount').innerText = (vData.followers || []).length;
            
            isFollowing = myFollowingList.includes(vData.username);
            updateFollowBtn();

            // Load Songs
            const songs = await (await fetch(`${API_URL}/songs`)).json();
            const vipSongs = songs.filter(s => s.uploader === vData.username && s.status === 'APPROVED');
            document.getElementById('vipSongCount').innerText = vipSongs.length;
            
            const listDiv = document.getElementById('vipSongsList');
            vipSongs.forEach(s => {
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                listDiv.innerHTML += `
                    <div class="list-song-row" onclick="window.location.href='/music.html?song=${s.id}'">
                        <div style="display:flex; align-items:center; gap:15px; width:70%;">
                            <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                            <div style="min-width:0;">
                                <div class="truncate" style="font-weight:bold; font-size:15px; color:white;">${s.filename}</div>
                                <div class="truncate" style="font-size:11px; color:var(--text-muted);">Uploader: ${s.uploader}</div>
                            </div>
                        </div>
                        <div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price||0} <span style="color:#666; margin-left:10px;">♡</span></div>
                    </div>
                `;
            });
            if(vipSongs.length === 0) listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无上传作品</div>`;
        }
        
        // Hide loader quickly
        setTimeout(() => document.getElementById('vipLoaderOverlay').style.display = 'none', 300);
    }

    function updateFollowBtn() {
        const btn = document.getElementById('followBtn');
        if(isFollowing) { btn.innerText = '已关注'; btn.classList.add('following'); }
        else { btn.innerText = '关注'; btn.classList.remove('following'); }
    }

    async function toggleFollow() {
        if(!username) return window.location.href = '/register.html';
        const res = await fetch(`${API_URL}/users/${username}/follow`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ targetUser: targetUser }) });
        if(res.ok) {
            isFollowing = !isFollowing; updateFollowBtn();
            let fc = parseInt(document.getElementById('vipFollowCount').innerText);
            document.getElementById('vipFollowCount').innerText = isFollowing ? fc + 1 : fc - 1;
        }
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
