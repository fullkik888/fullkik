<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK - DJ Profile</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        html { overflow-x:hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark; overflow-x:hidden;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* HEADER */
        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration:none;}
        .nav-tabs { display: flex; gap: 30px; align-items: center; overflow-x:auto; white-space:nowrap; scrollbar-width:none;}
        .nav-tabs::-webkit-scrollbar { display:none; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; text-decoration:none;}
        .nav-tab:hover { color: white; }
        .nav-tab.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .lang-toggle { font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); transition: 0.2s; flex-shrink:0;}
        .lang-toggle:hover { color: white; border-color: white;}

        .header-right { display: flex; align-items: center; gap: 15px; }
        .profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 30px; cursor: pointer; transition: 0.2s; text-decoration: none; border:none;}
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }
        .mail-button { position:relative; min-width:38px; height:38px; border-radius:50%; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:17px; }
        .mail-button:hover { border-color:var(--accent-light); background:rgba(128,0,0,0.22); }
        .mail-badge { position:absolute; right:-5px; top:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:99px; background:var(--danger); color:white; font-size:10px; font-weight:900; display:none; align-items:center; justify-content:center; box-shadow:0 0 0 4px rgba(255,69,58,0.12); }
        .profile-dropdown { position:absolute; top:48px; right:0; width:170px; display:none; flex-direction:column; overflow:hidden; border-radius:14px; border:1px solid var(--border-color); background:rgba(25,10,10,0.98); box-shadow:0 18px 44px rgba(0,0,0,0.55); z-index:200; }
        .profile-dropdown.show { display:flex; animation:popIn 0.2s ease; }
        .profile-dropdown button { border:none; border-bottom:1px solid var(--border-color); background:transparent; color:white; text-align:left; padding:14px 16px; cursor:pointer; font-size:13px; font-weight:800; }
        .profile-dropdown button:last-child { border-bottom:none; }
        .profile-dropdown button:hover { background:rgba(165,42,42,0.18); }
        .vip-center-pill { display:flex; align-items:center; justify-content:center; min-height:38px; padding:0 16px; border-radius:20px; background:linear-gradient(135deg, rgba(128,0,0,0.9), rgba(165,42,42,0.9)); color:white; text-decoration:none; font-size:13px; font-weight:800; border:1px solid rgba(255,255,255,0.12); white-space:nowrap; box-shadow:0 8px 20px rgba(128,0,0,0.25); }
        .vip-center-pill:hover { transform: translateY(-1px); box-shadow:0 10px 24px rgba(128,0,0,0.38); }
        .token-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; color: var(--token); border: 1px solid var(--border-color); text-decoration:none;}
        .token-pill:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }
        .btn-upgrade-top { background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s;}

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        .site-footer { width:100%; text-align:center; color:rgba(255,255,255,0.35); font-size:12px; padding:14px 0 22px; }
        
        .profile-banner { background: linear-gradient(135deg, #1c1010 0%, #0b0b0b 100%); border-radius: 20px; padding: 40px; display: flex; align-items: center; justify-content:space-between; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .profile-pic-large-wrap { position: relative; width: 100px; height: 100px; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex-shrink:0;}
        .profile-pic-large-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .follow-btn { background: var(--accent); color: white; border: none; padding: 8px 24px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; display:flex; align-items:center; justify-content:center;}
        .follow-btn:hover { background: var(--accent-light); }
        .follow-btn.following { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-muted); }
        .tip-reward-btn { background: rgba(192,132,252,0.14); color: #e9d5ff; border: 1px solid rgba(192,132,252,0.5); padding: 8px 24px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        .tip-reward-btn:hover { background: rgba(192,132,252,0.24); border-color: #c084fc; }
        .tip-reward-btn img { height: 16px; vertical-align: middle; }
        .tip-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .tip-ov.show { display: flex; }
        .tip-box { background: #160c0c; border: 1px solid var(--border-color); border-radius: 20px; padding: 28px 26px; width: min(92vw, 400px); box-shadow: 0 24px 70px rgba(0,0,0,0.7); }
        .tip-box h2 { margin: 0 0 18px; font-size: 22px; }
        .tip-chip2 { flex: 1; padding: 12px 0; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.04); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .tip-chip2:hover { border-color: #c084fc; }
        .tip-chip2.active { border-color: #c084fc; background: rgba(192,132,252,0.18); color: #e9d5ff; }
        .tip-in { width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.4); color: #fff; padding: 14px 16px; font-size: 16px; outline: none; }
        .tip-in:focus { border-color: #c084fc; }
        .tip-cta { width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .tip-cta img { height: 18px; vertical-align: middle; }

        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; margin-bottom: 10px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Fast Circle Loader for VIP Page */
        .vip-loader-overlay { position: fixed; inset: 0; background: rgba(11, 5, 5, 0.82); backdrop-filter:blur(14px); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction:column; }
        .vip-circle-wrap { position:relative; width:88px; height:88px; display:flex; align-items:center; justify-content:center; animation: loaderBreath 1.65s ease-in-out infinite; }
        .vip-circle-wrap::after { content:''; position:absolute; inset:17px; border-radius:50%; background:radial-gradient(circle, rgba(165,42,42,0.24), rgba(128,0,0,0)); filter:blur(4px); animation: loaderGlow 1.65s ease-in-out infinite; }
        .vip-circle-wrap svg { position:relative; z-index:1; overflow:visible; filter:drop-shadow(0 0 14px rgba(165,42,42,0.45)); }
        .vip-circle-wrap.loader-popout { animation: loaderPopout 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #vipLoadCircle { transform: rotate(-90deg); transform-origin:50% 50%; }
        @keyframes loaderBreath { 0%,100% { transform:scale(0.96); opacity:0.86; } 50% { transform:scale(1.05); opacity:1; } }
        @keyframes loaderGlow { 0%,100% { transform:scale(0.82); opacity:0.35; } 50% { transform:scale(1.15); opacity:0.72; } }
        @keyframes loaderPopout { 0% { transform:scale(1); opacity:1; } 55% { transform:scale(1.22); opacity:1; } 100% { transform:scale(0.72); opacity:0; filter:blur(6px); } }

        @media (max-width: 768px) {
            .header-top { padding: 12px 14px; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
            .logo-container { font-size: 18px; }
            .nav-tabs { order: 3; width: 100%; gap: 14px; padding-bottom: 2px; }
            .header-right { margin-left:auto; gap: 8px; }
            .vip-center-pill, .token-pill { min-height:36px; padding: 0 12px; font-size: 12px; }
            .profile-trigger { padding: 4px; }
            .profile-pic { width: 30px; height: 30px; }
            .container { padding: 132px 14px 32px; }
            .profile-banner { flex-direction:column; align-items:center; text-align:center; gap:20px; padding: 26px 18px; border-radius: 18px; }
            .profile-banner > div:first-child { gap:18px !important; }
            #vipName { font-size: 26px !important; line-height:1.2; }
            .list-song-row { padding: 12px; gap: 12px; align-items: center; }
            .list-song-row > div:first-child { width: auto !important; flex: 1; min-width: 0; }
            .follow-btn { min-height: 38px; }
        }
    </style>
    <script>
        (function() {
            const f12RedirectUrl = 'https://shopee.com.my/';
            window.addEventListener('keydown', function(event) {
                if(event.key === 'F12' || event.code === 'F12' || event.keyCode === 123) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    window.location.href = f12RedirectUrl;
                }
            }, true);
        })();
    </script>
</head>

<div class="vip-loader-overlay" id="vipLoaderOverlay">
    <div class="vip-circle-wrap">
        <svg width="80" height="80" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#2a1515" stroke-width="6"></circle>
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent-light)" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="283" id="vipLoadCircle" style="transition: stroke-dashoffset 0.1s;"></circle>
        </svg>
    </div>
</div>

<div id="toast" class="toast"></div>

<div class="header-top">
    <a href="/music.html" class="logo-container">FULLKIK</a>
    <div class="nav-tabs" id="mainNavTabs">
        <a href="/music.html" class="nav-tab">首页</a>
        <a href="/music.html" class="nav-tab">排行榜</a>

</div>

<div class="container">
    <div class="profile-banner">
        <div style="display:flex; align-items:center; gap:30px; flex-wrap:wrap; justify-content:center;">
            <div class="profile-pic-large-wrap" id="pfpWrap">
                <img id="vipPfp" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E">
            </div>

                </div>
                <div id="vipWechat" style="color:#34c759; font-size:13px; margin-top:8px; display:none; align-items:center; gap:5px;"></div>
                <div style="color:var(--text-muted); margin-top:5px; font-size:14px;"><span id="vipSongCount">0</span> 首上传歌曲 | <span id="vipFollowCount">0</span> 人关注 | 总共下载 <span id="vipDownloadCount">0</span></div>

<!-- 打赏 / Tip a DJ -->
<div class="tip-ov" id="tipModal">
    <div class="tip-box">
        <h2>打赏 <span id="tipDjName" style="color:#c084fc;">DJ</span></h2>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04); border:1px solid var(--border-color); border-radius:12px; padding:12px 16px; margin-bottom:16px;">
            <span style="color:var(--text-muted); font-size:13px;">我的余额 Balance</span>
            <span style="font-weight:800;">💎 <span id="tipBalance">0</span></span>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:14px;">
            <button type="button" class="tip-chip2" onclick="setTipAmount(10)">10</button>
            <button type="button" class="tip-chip2" onclick="setTipAmount(50)">50</button>
            <button type="button" class="tip-chip2" onclick="setTipAmount(100)">100</button>
            <button type="button" class="tip-chip2" onclick="setTipAmount(200)">200</button>
        </div>
        <input type="number" id="tipAmountInput" class="tip-in" min="1" placeholder="输入打赏钻石数量" oninput="onTipAmountInput()">
        <div id="tipMsg" style="color:var(--danger); font-weight:800; font-size:13px; margin-top:8px; min-height:16px;"></div>
        <button class="tip-cta" id="tipConfirmBtn" style="margin-top:6px;" onclick="confirmTip()">确认打赏 <img src="/purple-gem.png" onerror="this.replaceWith('🟣')"> <span id="tipConfirmAmt">0</span></button>
        <button type="button" onclick="closeTipModal()" style="width:100%; margin-top:10px; background:none; border:1px solid var(--border-color); color:var(--text-muted); padding:10px; border-radius:12px; cursor:pointer; font-size:13px;">取消 / Cancel</button>
    </div>
</div>

<!-- 成功打赏 -->
<div class="tip-ov" id="tipSuccessModal">
    <div class="tip-box" style="text-align:center;">
        <div style="font-size:46px; margin-bottom:8px;">🎉</div>
        <h2 style="justify-content:center;">成功打赏</h2>
        <p style="color:var(--text-muted); font-size:14px; margin:0 0 22px;" id="tipSuccessMsg">已送出打赏</p>
        <button class="tip-cta" onclick="closeTipSuccess()">好的 / OK</button>
    </div>
</div>

<script>
    const API_URL = '/api';
    const username = localStorage.getItem('djUsername');
    let myTokens = 0;
    let targetUser = '';
    let targetUserData = null;
    let isFollowing = false;
    let myFollowingList = [];
    let userNotifications = [];
    const vipUrlParams = new URLSearchParams(window.location.search);
    const incomingReferralCode = vipUrlParams.get('ref');
    if(incomingReferralCode) localStorage.setItem('fullkikReferral', incomingReferralCode);

    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    // ---- 打赏 / Tip this DJ (blue gems -> DJ withdrawable purple gems, 1:1) ----
    let _tipAmount = 0;
    function openTipModal() {
        if(!username) return window.location.href = '/register.html';
        if(!targetUserData || !targetUserData.username) return;
        if(String(username).toLowerCase() === String(targetUserData.username).toLowerCase()) return showToast('不能打赏自己');
        document.getElementById('tipDjName').innerText = targetUserData.djName || targetUserData.username;
        document.getElementById('tipBalance').innerText = myTokens || 0;
        document.getElementById('tipAmountInput').value = '';
        document.getElementById('tipMsg').innerText = '';
        setTipAmount(0);
        document.getElementById('tipModal').classList.add('show');
    }
    function closeTipModal() { document.getElementById('tipModal').classList.remove('show'); }
    function setTipAmount(n) {
        _tipAmount = parseInt(n) || 0;
        const inp = document.getElementById('tipAmountInput'); if(_tipAmount > 0) inp.value = _tipAmount;
        document.getElementById('tipConfirmAmt').innerText = _tipAmount;
        document.querySelectorAll('#tipModal .tip-chip2').forEach(c => c.classList.toggle('active', parseInt(c.innerText) === _tipAmount));
    }
    function onTipAmountInput() {
        const v = parseInt(document.getElementById('tipAmountInput').value) || 0;
        _tipAmount = v > 0 ? v : 0;
        document.getElementById('tipConfirmAmt').innerText = _tipAmount;
        document.querySelectorAll('#tipModal .tip-chip2').forEach(c => c.classList.toggle('active', parseInt(c.innerText) === _tipAmount));
    }
    async function confirmTip() {
        const amount = _tipAmount; const msg = document.getElementById('tipMsg');
        if(!(amount >= 1)) { msg.innerText = '请输入打赏数量 / Enter an amount'; return; }
        if(amount > (myTokens || 0)) { msg.innerText = '钻石余额不足 / Not enough gems'; return; }
        const btn = document.getElementById('tipConfirmBtn'); if(btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
        try {
            const res = await fetch(`${API_URL}/users/${username}/tip`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('fkUserToken') || '') },
                body: JSON.stringify({ to: targetUserData.username, amount })
            });
            const data = await res.json().catch(() => ({}));
            if(res.ok) {
                myTokens = (data.tokens != null) ? data.tokens : ((myTokens || 0) - amount);
                const td = document.getElementById('tokenDisplay'); if(td) td.innerText = myTokens;
                closeTipModal();
                document.getElementById('tipSuccessMsg').innerText = `已送出 ${amount} 钻石给 ${data.uploader || targetUserData.username}`;
                document.getElementById('tipSuccessModal').classList.add('show');
            } else if(res.status === 401) {
                msg.innerText = '请重新登录 / Please log in again'; setTimeout(() => window.location.href = '/register.html', 1200);
            } else {
                msg.innerText = data.message || '打赏失败 / Failed';
            }
        } catch(e) { msg.innerText = '网络错误，请重试 / Network error'; }
        finally { if(btn) { btn.disabled = false; btn.style.opacity = ''; } }
    }
    function closeTipSuccess() { document.getElementById('tipSuccessModal').classList.remove('show'); }
    function closeDropdowns(e) {
        const dropdown = document.getElementById('profileDropdown');
        if(dropdown && dropdown.classList.contains('show') && !e.target.closest('.profile-trigger') && !e.target.closest('#profileDropdown')) dropdown.classList.remove('show');
    }
    function toggleProfileDropdown(e) {
        if(!username) return window.location.href = '/register.html';
        e.stopPropagation();
        const dropdown = document.getElementById('profileDropdown');
        if(dropdown) dropdown.classList.toggle('show');
    }
    function logoutUser() {
        localStorage.removeItem('djUsername');
        localStorage.removeItem('djLastView');
        window.location.href = '/register.html';
    }
    function openNotifications() {
        window.location.href = username ? '/music.html?view=notifications&skipLoader=1' : '/register.html';
    }
    function updateNotificationBadge() {
        const badge = document.getElementById('mailBadge');
        if(!badge) return;
        const unread = (userNotifications || []).filter(n => !n.read).length;
        if(unread > 0) {
            badge.style.display = 'flex';
            badge.innerText = unread > 99 ? '99+' : unread;
        } else {
            badge.style.display = 'none';
        }
    }
    function getTargetUserFromPath() {
        const match = window.location.pathname.match(/^\/(?:dj|producer)\/([^/]+)\/profile/i);
        return match ? decodeURIComponent(match[1]) : '';
    }
    function setVipLoaderProgress(value) {
        const circle = document.getElementById('vipLoadCircle');
        if(circle) circle.style.strokeDashoffset = 283 - (283 * value / 100);
    }
    function finishVipLoader() {
        setVipLoaderProgress(100);
        const overlay = document.getElementById('vipLoaderOverlay');
        const wrap = document.querySelector('.vip-circle-wrap');
        setTimeout(() => {
            if(wrap) wrap.classList.add('loader-popout');
            setTimeout(() => { if(overlay) overlay.style.display = 'none'; }, 430);
        }, 120);
    }

    async function init() {
        setVipLoaderProgress(18);
        if(!username) { 
            document.getElementById('tokenUI').style.display = 'none'; 
            const mailBtn = document.getElementById('mailBtn'); if(mailBtn) mailBtn.style.display = 'none';
            document.getElementById('vipCenterTopBtn').href = '/register.html';
            document.getElementById('profileBtn').outerHTML = `<button class="btn-upgrade-top" onclick="window.location.href='/register.html'">登录</button>`;
        } else {
            const meRes = await fetch(`${API_URL}/users/${username}`);
            if(meRes.ok) {
                const me = await meRes.json();
                myTokens = me.tokens || 0;
                document.getElementById('tokenDisplay').innerText = me.tokens || 0;
                userNotifications = me.notifications || [];
                updateNotificationBadge();
                document.getElementById('profileBtn').innerHTML = `<img class="profile-pic" src="${me.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E"}">`;
                myFollowingList = me.following || [];
            }
        }
        setVipLoaderProgress(35);

        const urlParams = new URLSearchParams(window.location.search);
        targetUser = urlParams.get('user') || getTargetUserFromPath();
        if(!targetUser) return document.body.innerHTML = '<h2 style="margin-top:100px; text-align:center;">User Not Found</h2>';

        // Load Nav Genres
        let settings = {};
        try { settings = await (await fetch(`${API_URL}/settings`)).json(); } catch(e) {}
        const genres = await (await fetch(`${API_URL}/genres`)).json();
        const nav = document.getElementById('mainNavTabs');
        const homeNode = nav.children[0];
        const topIds = Array.isArray(settings.topNavGenreIds) && settings.topNavGenreIds.length
            ? settings.topNavGenreIds.slice(0, 4)
            : genres.filter(g => g.status !== 'DISABLED').slice(0, 3).map(g => g.id);
        topIds.map(id => genres.find(g => g.id === id && g.status !== 'DISABLED')).filter(Boolean).forEach(g => {
            const btn = document.createElement('a'); btn.className = 'nav-tab'; btn.innerText = g.name; btn.href = `/music.html`;
            nav.insertBefore(btn, homeNode.nextSibling);
        });
        setVipLoaderProgress(52);

        // Load VIP Details
        const res = await fetch(`${API_URL}/users/${targetUser}`);
        if(res.ok) {
            const vData = await res.json();
            targetUserData = vData;
            const displayName = vData.djName || vData.username;
            document.getElementById('vipName').innerText = displayName;
            document.title = `${displayName} - 主面`;
            document.getElementById('vipPfp').src = vData.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            
            // Handle Role Tags
            const rTag = document.getElementById('roleTag');
            if(vData.role === 'PRODUCER') {
                rTag.innerText = '👑 PRODUCER'; rTag.style.display = 'inline-block';
                document.getElementById('pfpWrap').style.border = '2px solid var(--accent)';
            } else if (vData.isVip || vData.role === 'VIP') {
                rTag.innerText = 'VIP'; rTag.style.display = 'inline-block';
                document.getElementById('pfpWrap').style.border = 'none';
            } else {
                rTag.style.display = 'none';
                document.getElementById('pfpWrap').style.border = 'none';
            }

            if(vData.wechatPublic && vData.wechat) {
                const wc = document.getElementById('vipWechat'); wc.style.display = 'flex';
                wc.innerHTML = `<svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M8.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S9.1,13.5,8.5,13.5z M12.5,13.5c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1 S13.1,13.5,12.5,13.5z M20,10.5c0-4.1-4-7.5-9-7.5s-9,3.4-9,7.5c0,2.3,1.3,4.4,3.4,5.7l-0.9,2.8l3.2-1.6 c1.1,0.3,2.2,0.5,3.4,0.5C16,18,20,14.6,20,10.5z"/></svg> 微信号: <span id="vipWechatText">${vData.wechat}</span><button onclick="copyWechat(event)" style="border:none;background:rgba(255,255,255,0.08);color:white;border-radius:8px;padding:4px 7px;cursor:pointer;">⧉</button>`;
            }
            document.getElementById('vipFollowCount').innerText = (vData.followers || []).length;
            
            isFollowing = myFollowingList.includes(vData.username);
            updateFollowBtn();

            // Show 打赏 (tip) button unless you're viewing your own page (can't tip yourself).
            const tipBtn = document.getElementById('tipRewardBtn');
            if(tipBtn) tipBtn.style.display = (username && String(username).toLowerCase() === String(vData.username).toLowerCase()) ? 'none' : 'flex';

            // Load Songs
            const songs = await (await fetch(`${API_URL}/songs`)).json();
            const vipSongs = songs.filter(s => s.uploader === vData.username && s.status === 'APPROVED');
            document.getElementById('vipSongCount').innerText = vipSongs.length;
            const totalDownloads = vipSongs.reduce((sum, s) => sum + (parseInt(s.downloads) || 0), 0);
            document.getElementById('vipDownloadCount').innerText = totalDownloads;
            
            const listDiv = document.getElementById('vipSongsList');
            vipSongs.forEach(s => {
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                listDiv.innerHTML += `
                    <div class="list-song-row" onclick="window.location.href='/music.html?song=${s.id}&skipLoader=1'">
                        <div style="display:flex; align-items:center; gap:15px; width:70%;">
                            <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                            <div style="min-width:0;">
                                <div class="truncate" style="font-weight:bold; font-size:15px; color:white;">${s.filename}</div>
                                <div class="truncate" style="font-size:11px; color:var(--text-muted);">${s.uploader}</div>
                            </div>
                        </div>
                        <div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price||0} <span style="color:#666; margin-left:10px;">♡</span></div>
                    </div>
                `;
            });
            if(vipSongs.length === 0) listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无上传作品</div>`;
        }
        
        finishVipLoader();
    }

    function updateFollowBtn() {
        const btn = document.getElementById('followBtn');
        if(isFollowing) { btn.innerText = '已关注'; btn.classList.add('following'); }
        else { btn.innerText = '+ 关注'; btn.classList.remove('following'); }
    }

    function copyWechat(event) {
        if(event) event.stopPropagation();
        const value = document.getElementById('vipWechatText')?.innerText || '';
        if(!value) return;
        navigator.clipboard?.writeText(value);
        showToast('微信号已复制');
    }

    function shareProfileLink() {
        if(!targetUserData) return;
        const roleSlug = targetUserData.role === 'PRODUCER' ? 'producer' : 'dj';
        const shareUser = encodeURIComponent(targetUserData.username || targetUser);
        const ref = username ? `?ref=${encodeURIComponent(username)}` : '';
        const shareUrl = `${window.location.origin}/${roleSlug}/${shareUser}/profile${ref}`;
        navigator.clipboard?.writeText(shareUrl);
        showToast('分享链接已复制');
        setTimeout(() => { window.location.href = shareUrl; }, 350);
    }

    async function toggleFollow() {
        if(!username) return window.location.href = '/register.html';
        const res = await fetch(`${API_URL}/users/${username}/follow`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ targetUser: targetUser }) });
        if(res.ok) {
            isFollowing = !isFollowing; updateFollowBtn();
            let fc = parseInt(document.getElementById('vipFollowCount').innerText);
            document.getElementById('vipFollowCount').innerText = isFollowing ? fc + 1 : fc - 1;
        }
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
