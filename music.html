<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        html { overflow-x: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark; overflow-x: hidden;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration:none; cursor:pointer;}
        .nav-tabs { display: flex; gap: 30px; align-items: center; overflow-x:auto; white-space:nowrap; scrollbar-width:none;}
        .nav-tabs::-webkit-scrollbar { display:none; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; text-decoration:none;}
        .nav-tab:hover { color: white; }
        .nav-tab.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .lang-toggle { font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); transition: 0.2s; flex-shrink:0;}
        .lang-toggle:hover { color: white; border-color: white;}

        .header-right { display: flex; align-items: center; gap: 15px; }
        .profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 30px; cursor: pointer; transition: 0.2s; text-decoration: none;}
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }
        .vip-center-pill { display:flex; align-items:center; justify-content:center; min-height:38px; padding:0 16px; border-radius:20px; background:linear-gradient(135deg, rgba(128,0,0,0.9), rgba(165,42,42,0.9)); color:white; text-decoration:none; font-size:13px; font-weight:800; border:1px solid rgba(255,255,255,0.12); white-space:nowrap; box-shadow:0 8px 20px rgba(128,0,0,0.25); }
        .vip-center-pill:hover { transform: translateY(-1px); box-shadow:0 10px 24px rgba(128,0,0,0.38); }
        .token-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; color: var(--token); border: 1px solid var(--border-color); text-decoration:none;}
        .token-pill:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        
        .view-section { display: none; animation: fadeIn 0.4s ease; width: 100%;}
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SPLASH LOADER --- */
        #splashLoader { display:flex; position:fixed; inset:0; background:rgba(11, 11, 11, 0.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); z-index:9999999; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease; }
        .splash-circle-wrap { position:relative; width:88px; height:88px; display:flex; align-items:center; justify-content:center; margin-bottom:22px; animation: loaderBreath 2.1s ease-in-out infinite; }
        .splash-circle-wrap::after { content:''; position:absolute; inset:17px; border-radius:50%; background:radial-gradient(circle, rgba(165,42,42,0.24), rgba(128,0,0,0)); filter:blur(4px); animation: loaderGlow 2.1s ease-in-out infinite; }
        .splash-circle-wrap svg { position:relative; z-index:1; overflow:visible; filter:drop-shadow(0 0 14px rgba(165,42,42,0.45)); }
        .splash-circle-wrap.loader-popout { animation: loaderPopout 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #initLoadCircle { transform: rotate(-90deg); transform-origin:50% 50%; }
        @keyframes loaderBreath { 0%,100% { transform:scale(0.96); opacity:0.86; } 50% { transform:scale(1.05); opacity:1; } }
        @keyframes loaderGlow { 0%,100% { transform:scale(0.82); opacity:0.35; } 50% { transform:scale(1.15); opacity:0.72; } }
        @keyframes loaderPopout { 0% { transform:scale(1); opacity:1; } 55% { transform:scale(1.22); opacity:1; } 100% { transform:scale(0.72); opacity:0; filter:blur(6px); } }
        .welcome-text { display:none; font-size:28px; font-weight:900; letter-spacing:8px; color:var(--text-main); margin-top:20px;}
        .welcome-text span { display:inline-block; opacity:0; transform:translateY(20px); animation: popUp 0.1s forwards linear; }
        .welcome-text span:nth-child(1) { animation-delay: 0.1s; } .welcome-text span:nth-child(2) { animation-delay: 0.2s; } .welcome-text span:nth-child(3) { animation-delay: 0.3s; } .welcome-text span:nth-child(4) { animation-delay: 0.4s; }
        .welcome-text span:nth-child(5) { animation-delay: 0.5s; } .welcome-text span:nth-child(6) { animation-delay: 0.6s; } .welcome-text span:nth-child(7) { animation-delay: 0.7s; } .welcome-text span:nth-child(8) { animation-delay: 0.8s; }
        .welcome-text span:nth-child(9) { animation-delay: 0.9s; } .welcome-text span:nth-child(10) { animation-delay: 1.0s; } .welcome-text span:nth-child(11) { animation-delay: 1.1s; }
        @keyframes popUp { to { opacity:1; transform:translateY(0); } }

        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 36px; margin: 0 0 10px 0; font-weight: 700; letter-spacing: 2px;}
        .hero p { color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0;}
        
        .banners-container { display:flex; gap:10px; margin: 0 auto 20px auto; width:100%; max-width:800px; justify-content:center; overflow-x:auto; scrollbar-width:none;}
        .banners-container::-webkit-scrollbar { display:none; }
        .banners-container img { width:30%; height:120px; object-fit:cover; border-radius:12px; border:1px solid var(--border-color); flex-shrink:0;}

        /* SEARCH UI */
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-bar { width: 100%; padding: 16px 24px; border-radius: 30px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: white; font-size: 16px; outline: none; box-sizing: border-box;}
        .search-dropdown { position: absolute; top: calc(100% + 10px); left: 0; width: 100%; background: #1a0f0f; border: 1px solid var(--border-color); border-radius: 12px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; text-align:left;}
        .search-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;}
        .search-item:hover { background: rgba(255,255,255,0.05); }
        .search-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;}
        
        /* HOMEPAGE GRIDS & DJ SCROLL */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-top:40px; margin-bottom: 15px;}
        .section-header h3 { margin: 0; font-size: 20px; font-weight: 700;}
        .section-header span { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 15px; background: rgba(255,255,255,0.05); transition:0.2s;}
        .section-header span:hover { color: white; background: rgba(255,255,255,0.1); }

        .dj-scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
        .dj-scroll-container::-webkit-scrollbar { display: none; }
        .dj-card { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; flex-shrink: 0; position:relative; cursor:pointer;}
        .dj-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); background:#1a0f0f;}
        .dj-rank { position: absolute; top: 0; left: 5px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white;}
        .rank-1 { background: linear-gradient(45deg, #FFD700, #FDB931); border:1px solid #B8860B; }
        .rank-2 { background: linear-gradient(45deg, #C0C0C0, #E0E0E0); border:1px solid #A9A9A9; color:#333;}
        .rank-3 { background: linear-gradient(45deg, #CD7F32, #D2691E); border:1px solid #8B4513; }
        .dj-name { font-size: 12px; font-weight: bold; width:100%; text-align:center;}
        .dj-count { font-size: 10px; color: var(--text-muted); }

        .home-song-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .home-song-row-card { display: flex; align-items: center; gap: 15px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; min-width: 0;}
        .home-song-row-card:hover { border-color: var(--accent-light); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(128,0,0,0.3);}
        .home-song-row-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0;}
        .home-song-row-card .info { flex: 1; min-width: 0; display:flex; flex-direction:column; gap:5px;}
        .home-song-row-card .info .title { font-size: 14px; font-weight: bold; color: white;}
        .home-song-row-card .info .sub { font-size: 11px; color: var(--text-muted);}
        .home-song-row-card .price { font-size: 12px; font-weight: bold; color: var(--token); white-space:nowrap; margin-right:10px;}
        .featured-genre-tabs { display:flex; gap:18px; overflow-x:auto; scrollbar-width:none; margin:-2px 0 18px; padding-bottom:6px; }
        .featured-genre-tabs::-webkit-scrollbar { display:none; }
        .featured-genre-tab { background:none; border:none; color:var(--text-muted); font-size:15px; font-weight:800; cursor:pointer; padding:0 0 8px; border-bottom:2px solid transparent; white-space:nowrap; }
        .featured-genre-tab.active { color:var(--accent-light); border-bottom-color:var(--accent-light); }
        .featured-empty { border:1px dashed var(--border-color); border-radius:12px; padding:28px; text-align:center; color:var(--text-muted); background:rgba(255,255,255,0.02); }

        /* RANKING LIST & MORE LIST */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }
        .ranking-num { width: 30px; font-size: 18px; font-weight: bold; text-align: center; }
        .rank-gold { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-silver { color: #C0C0C0; }
        .rank-bronze { color: #CD7F32; }
        .rank-normal { color: var(--text-muted); }

        .custom-pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; flex-wrap:wrap;}
        .p-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size:13px;}
        .p-btn:hover:not(:disabled) { border-color: var(--accent-light); color: white;}
        .p-btn.active { background: var(--accent-light); color: white; border-color: var(--accent-light);}
        .p-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* DJ / PRODUCER DIRECTORY */
        .dj-grid-large { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top:20px; }
        .dj-card-large { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s;}
        .dj-card-large:hover { border-color: var(--accent-light); transform: translateY(-3px); }
        .dj-card-large img.pfp { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 10px; object-fit: cover;}
        .dj-card-large .name { font-weight: bold; font-size: 16px; margin-bottom: 5px; color:white; display:flex; align-items:center; gap:5px;}
        .dj-card-large .songs { font-size: 12px; color: var(--text-muted); margin-bottom: 15px;}
        .dj-card-large .mini-covers { display: flex; gap: 5px; }
        .dj-card-large .mini-covers img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover;}

        /* PLAYER */
        .player-header { display: flex; align-items: center; margin-bottom: 30px;}
        .btn-back { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;}
        .btn-back:hover { color: white; }
        
        .player-container { display: flex; gap: 40px; background: rgba(255,255,255,0.02); border-radius: 24px; padding: 40px; border: 1px solid var(--border-color); position:relative;}
        .player-left { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0;}
        .player-title { font-size: 32px; font-weight: 700; margin: 0 0 6px 0;}
        .player-meta { color: var(--text-muted); font-size: 14px; margin-bottom: 16px;}
        .uploader-link { color:var(--accent-light); font-weight:800; cursor:pointer; border-bottom:1px solid rgba(165,42,42,0.45); }
        .uploader-link:hover { color:white; border-bottom-color:white; }
        
        .waveform-ui { width: 100%; height: 60px; display: flex; align-items: center; gap: 3px; margin-bottom: 12px;}
        .wave-bar { flex: 1; background: var(--border-color); border-radius: 2px; transition: 0.2s;}
        
        .audio-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 16px;}
        .play-circle { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .play-circle:hover { transform: scale(1.05); background: var(--accent-light); }
        .play-circle svg { width: 24px; height: 24px; fill: white; }
        
        .slider-container { position: relative; flex: 1; height: 24px; display: flex; align-items: center; }
        .inline-progress-fill { position: absolute; left: 0; height: 4px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 1;}
        input[type=range].seeker { position: absolute; width: 100%; -webkit-appearance: none; background: transparent; z-index: 2; margin: 0; outline: none;}
        input[type=range].seeker::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; cursor: pointer; }
        input[type=range].seeker::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

        .action-row { display: flex; gap: 15px;}
        .btn-buy-big { background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 16px 30px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; display:flex; align-items:center; gap:10px; text-decoration:none;}
        .btn-buy-big:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(128, 0, 0, 0.4);}
        .btn-buy-big.purchased { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color:var(--text-muted); cursor:default;}
        .btn-buy-big.purchased:hover { transform: none; box-shadow: none; }
        
        .player-right { width: 350px; flex-shrink: 0; position:relative;}
        .player-cover { width: 100%; aspect-ratio: 1; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);}

        .heart-btn { background:none; border:1px solid var(--border-color); border-radius:12px; padding:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;}
        .heart-btn svg { width:24px; height:24px; stroke:white; stroke-width:2; fill:none; transition:0.2s;}
        .heart-btn.liked { border-color:var(--danger); }
        .heart-btn.liked svg { fill:var(--danger); stroke:var(--danger); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;}
        .modal-box { background: rgba(30, 15, 15, 0.95); backdrop-filter: blur(30px); width: 100%; max-width: 380px; border-radius: 24px; text-align: center; border: 1px solid var(--border-color); animation: popIn 0.3s; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8);}
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content { padding: 30px 20px; }
        .modal-actions { display: flex; border-top: 1px solid var(--border-color); }
        .modal-btn { flex: 1; padding: 16px; border: none; background: transparent; font-size: 16px; cursor: pointer; color: #fff; font-weight: 600; transition: 0.2s;}
        .modal-btn:hover { background: rgba(255,255,255,0.05); }
        .modal-btn.cancel { border-right: 1px solid var(--border-color); color: var(--text-muted); font-weight: 400;}
        .report-modal-box { max-width:560px; text-align:left; border:1px solid var(--accent-light); background:rgba(30,24,42,0.96); border-radius:28px; overflow:visible; padding:42px 48px; box-sizing:border-box; position:relative; }
        .report-close { position:absolute; top:24px; right:24px; width:34px; height:34px; border:none; background:transparent; color:var(--text-muted); font-size:32px; line-height:1; cursor:pointer; }
        .report-close:hover { color:white; }
        .report-title { margin:0 0 34px; font-size:30px; line-height:1.1; font-weight:900; }
        .report-label { display:block; color:var(--text-muted); font-weight:800; margin:0 0 10px; }
        .report-select, .report-textarea { width:100%; box-sizing:border-box; background:rgba(9,7,28,0.72); color:white; border:1px solid rgba(255,255,255,0.16); border-radius:14px; padding:14px 16px; font-size:15px; outline:none; margin-bottom:20px; }
        .report-select:focus, .report-textarea:focus { border-color:var(--accent-light); box-shadow:0 0 0 2px rgba(165,42,42,0.24); }
        .report-textarea { min-height:120px; resize:vertical; }
        .report-submit { width:100%; min-height:58px; border:none; border-radius:14px; background:linear-gradient(90deg, var(--accent), var(--accent-light)); color:white; font-size:18px; font-weight:900; cursor:pointer; margin-top:6px; }
        .report-submit:hover { transform:translateY(-1px); box-shadow:0 14px 30px rgba(128,0,0,0.34); }

        .whatsapp-float { position: fixed; right: 24px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; display: none; align-items: center; justify-content: center; z-index: 900; box-shadow: 0 12px 28px rgba(128,0,0,0.45); border: 1px solid rgba(255,255,255,0.18); transition: 0.2s; }
        .whatsapp-float:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 34px rgba(128,0,0,0.55); }
        .whatsapp-float svg { width: 30px; height: 30px; fill: currentColor; }

        .poster-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 24px; box-sizing: border-box; }
        .poster-box { position: relative; width: min(92vw, 560px); max-height: 86vh; border-radius: 18px; overflow: hidden; border: 1px solid var(--border-color); background: rgba(30,15,15,0.98); box-shadow: 0 24px 70px rgba(0,0,0,0.85); }
        .poster-box img { width: 100%; max-height: 86vh; object-fit: contain; display: block; }
        .poster-close { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.55); color: white; cursor: pointer; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .poster-close:hover { background: var(--accent); }

        /* VIP TABS (For DJ List View) */
        .vip-tabs { display: flex; gap: 30px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; overflow-x: auto; white-space: nowrap;}
        .vip-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 0; outline: none;}
        .vip-tab.active { color: var(--accent-light); font-weight: bold; }

        @media (max-width: 768px) {
            .header-top { padding: 12px 14px; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
            .header-right { width: 100%; justify-content: flex-end; gap: 8px; }
            .header-right > div { gap: 8px !important; max-width: 100%; }
            .vip-center-pill, .token-pill { min-height: 36px; padding: 0 12px; font-size: 12px; }
            .profile-trigger { padding: 4px; }

<script>
    const API_URL = '/api';
    let allGenres = [], allSongs = [], allUsers = [], userPurchases = [], userFavorites = [];
    let currentSong = null; let userTokens = 0, isUserVip = false;
    const username = localStorage.getItem('djUsername');
    const audioEl = document.getElementById('mainAudio');
    const initialUrlParams = new URLSearchParams(window.location.search);
    const skipInitialLoader = initialUrlParams.get('skipLoader') === '1';
    if(skipInitialLoader) {
        const sp = document.getElementById('splashLoader');
        if(sp) sp.style.display = 'none';
    }
    
    const dict = {
        en: { store: "Store", ranking: "Ranking", login: "Login", heroSub: "Exclusive DJ Rhythms · Electro · Club Bangers", search: "Search songs...", back: "Back", cancel: "Cancel", previewLimit: "Login to purchase. Preview limited to 30s.", buyBtn: "BUY", report: "Report" },
        cn: { store: "首页", ranking: "排行榜", login: "登录", heroSub: "专属DJ节奏空间 · 电音串烧 · 车载热播 · 精选原创作品", search: "搜索歌曲...", back: "返回", cancel: "取消", previewLimit: "试听只有30秒", buyBtn: "购买", report: "举报" }
    };
    let currentLang = localStorage.getItem('djLang') || 'cn';

    function toggleLang() { currentLang = currentLang === 'en' ? 'cn' : 'en'; localStorage.setItem('djLang', currentLang); applyLang(); }

    function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(dict[currentLang][key]) el.innerText = dict[currentLang][key]; });
        document.querySelectorAll('[data-placeholder]').forEach(el => { const key = el.getAttribute('data-placeholder'); if(dict[currentLang][key]) el.placeholder = dict[currentLang][key]; });
        const mainS = document.getElementById('mainSearch'); if(mainS) mainS.placeholder = dict[currentLang].search;
        if(!username && document.getElementById('profileBtnText')) document.getElementById('profileBtnText').innerText = dict[currentLang].login;
        if(currentSong) openSong(currentSong.id);
        
        try {
            const vRank = document.getElementById('view-ranking'); if(vRank && vRank.classList.contains('active')) renderRanking();
        } catch(e) {}
    }

    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.className = 'toast'; if(isError) t.style.borderColor = 'var(--danger)'; t.innerHTML = `<span style="color:${isError ? 'white' : 'var(--accent)'}; font-weight:bold;">${isError ? '!' : '✓'}</span> ${msg}`; t.classList.add('show'); setTimeout(() => {t.classList.remove('show'); t.style.borderColor = 'var(--border-color)';}, 3500); }
    function formatBytes(bytes) { if (!bytes) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k)); return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]; }
    function formatTime(sec) { if(isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0'+s : s}`; }
    function setMusicPageTitle(view, detail = '') {
        const titles = {
            home: 'FULLKIK 首页',
            ranking: 'FULLKIK 排行榜',
            'dj-list': 'FULLKIK VIP',
            'more-songs': detail ? `${detail} - 音乐` : 'FULLKIK 音乐',
            song: detail ? `${detail} - 音乐` : 'FULLKIK 音乐'
        };
        document.title = titles[view] || 'FULLKIK 首页';
    }

    // --- SEARCH UI LOGIC ---
    function handleGlobalSearch(e) {
        const query = e.target.value.toLowerCase(); const drop = document.getElementById('searchResults');
        if(!query) { drop.style.display = 'none'; return; }
        
        const filtered = allSongs.filter(s => s.status === 'APPROVED' && (s.filename.toLowerCase().includes(query) || (s.uploader && s.uploader.toLowerCase().includes(query))));
        drop.innerHTML = '';
        if(filtered.length === 0) { drop.innerHTML = `<div style="padding:15px; color:var(--text-muted); text-align:center;">No results found</div>`; } 
        else {
            filtered.forEach(s => {
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                drop.innerHTML += `<div class="search-item" onclick="openSong('${s.id}')"><img src="${cover}"><div><div class="truncate" style="font-weight:bold; font-size:14px; max-width:400px;">${s.filename}</div><div class="truncate" style="font-size:12px; color:var(--text-muted);">${s.uploader || 'FULLKIK'}</div></div></div>`;
            });
        }
        drop.style.display = 'block';
    }
    document.addEventListener('click', (e) => { const sw = e.target.closest('.search-wrapper'); const dr = document.getElementById('searchResults'); if(!sw && dr) dr.style.display = 'none'; });

    let globalSettings = {};
    let currentFeaturedGenreId = null;

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function buildWhatsappUrl(value) {
        const digits = String(value || '').replace(/[^\d]/g, '');
        return digits ? `https://wa.me/${digits}` : '';
    }

    function renderSupportWhatsapp() {
        const btn = document.getElementById('supportWhatsappBtn');
        if(!btn) return;
        const url = buildWhatsappUrl(globalSettings.supportWhatsapp);
        if(url) {
            btn.href = url;
            btn.style.display = 'flex';
        } else {
            btn.style.display = 'none';
        }
    }

    function showHomePoster() {
        const overlay = document.getElementById('homePosterOverlay');
        const img = document.getElementById('homePosterImage');
        if(!overlay || !img || !globalSettings.homePosterUrl) return;
        img.src = globalSettings.homePosterUrl;
        overlay.style.display = 'flex';
    }

    function closeHomePoster() {
        const overlay = document.getElementById('homePosterOverlay');
        if(overlay) overlay.style.display = 'none';
    }

    // --- INITIALIZATION ---
    async function init() {
        const circle = document.getElementById('initLoadCircle');
        let loadProgress = 0; function setProg(p) { if(circle) circle.style.strokeDashoffset = 283 - (283 * p / 100); }
        setProg(10);
        let openedInitialSong = false;
        
        if(!username) { 
            const pb = document.getElementById('profileBtn');
            if(pb) pb.outerHTML = `<button class="btn-upgrade-top" onclick="window.location.href='/register.html'" id="profileBtnText" style="padding: 8px 20px; font-size: 14px;">${dict[currentLang].login}</button>`;
            if(document.getElementById('tokenUI')) document.getElementById('tokenUI').style.display = 'none'; 
            const vipBtn = document.getElementById('vipCenterTopBtn'); if(vipBtn) vipBtn.href = '/register.html';
        }

        try {
            const res = await fetch(`${API_URL}/settings`);
            if(res.ok) { 
                globalSettings = await res.json(); 
                if(globalSettings.headerTitle) { const lt = document.getElementById('logoText'); if(lt) lt.innerText = globalSettings.headerTitle; } 
                if(globalSettings.heroTitle) { const ht = document.getElementById('heroTitle'); if(ht) ht.innerText = globalSettings.heroTitle; } 
                renderSupportWhatsapp();
            }
            setProg(30);

            if(username) {
                const uRes = await fetch(`${API_URL}/users/${username}`);
                if(uRes.ok) { 
                    const data = await uRes.json(); userTokens = data.tokens || 0; userPurchases = data.purchases || []; userFavorites = data.favorites || []; isUserVip = data.isVip || false;
                    if(document.getElementById('tokenDisplay')) document.getElementById('tokenDisplay').innerText = userTokens;
                    
                    const pfpUrl = data.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                    const profBtn = document.getElementById('profileBtn'); if(profBtn) profBtn.innerHTML = `<img class="profile-pic" src="${pfpUrl}">`;
                } else if(uRes.status === 404) { localStorage.removeItem('djUsername'); window.location.reload(); }
            }
            setProg(50);
            
            allUsers = await (await fetch(`${API_URL}/all-users`)).json(); setProg(60);
            allGenres = await (await fetch(`${API_URL}/genres`)).json(); setProg(75);
            allSongs = await (await fetch(`${API_URL}/songs`)).json(); setProg(100);
            
            injectTopBarGenres();
            renderHome(allUsers);
            applyLang(); 

            const urlParams = new URLSearchParams(window.location.search);
            const requestedSongId = urlParams.get('song');
            if(requestedSongId) {
                openSong(requestedSongId);
                openedInitialSong = !!currentSong;
            }
        } catch(e) { console.error("Init Error:", e); } 

        const finishInitialNavigation = () => {
            if(openedInitialSong) return;
            const savedView = localStorage.getItem('djLastView');
            if(savedView && document.getElementById(`view-${savedView}`)) switchView(savedView);
            else switchView('home');
        };

        if(skipInitialLoader) {
            finishInitialNavigation();
            return;
        }

        setTimeout(() => {
            const ilt = document.getElementById('initLoadText'); if(ilt) ilt.style.display = 'none'; 
            const scw = document.querySelector('.splash-circle-wrap'); if(scw) scw.classList.add('loader-popout');
            setTimeout(() => {
                if(scw) scw.style.display = 'none';
                const wt = document.getElementById('welcomeText'); if(wt) wt.style.display = 'block';
            }, 420);
            setTimeout(() => { 
                const sp = document.getElementById('splashLoader'); 
                if(sp) { sp.style.opacity = 0; setTimeout(() => { sp.style.display = 'none'; showHomePoster(); }, 800); }
                finishInitialNavigation();
            }, 1500);
        }, 400);
    }

    function injectTopBarGenres() {
        const nav = document.getElementById('mainNavTabs');
        const homeNode = document.getElementById('nav-home');
        
        let validGenres = allGenres.filter(g => g.status !== 'DISABLED').slice(0, 3);
        validGenres.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'nav-tab';
            btn.innerText = g.name;
            btn.onclick = () => openMoreSongs(g.name, g.id);
            nav.insertBefore(btn, homeNode.nextSibling);
        });
    }

    function switchView(view) {
        if(audioEl) audioEl.pause(); document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const targetView = document.getElementById(`view-${view}`); if(targetView) targetView.classList.add('active');
        if(view === 'song' && currentSong) setMusicPageTitle('song', currentSong.filename);
        else setMusicPageTitle(view);
        
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        if(view === 'home' || view === 'song' || view === 'dj-list') { const ns = document.getElementById('nav-home'); if(ns) ns.classList.add('active'); }
        if(view === 'ranking') { const ns = document.getElementById('nav-ranking'); if(ns) ns.classList.add('active'); renderRanking(); }

        if(['home', 'ranking', 'more-songs'].includes(view)) localStorage.setItem('djLastView', view);
    }

    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
    function closeReportModal() { const modal = document.getElementById('reportModal'); if(modal) modal.style.display = 'none'; }
    function openReportModal() {
        if(!currentSong) return showToast('请先选择歌曲', true);
        const reason = document.getElementById('reportReasonSelect');
        const desc = document.getElementById('reportDescriptionInput');
        if(reason) reason.value = '';
        if(desc) desc.value = '';
        document.getElementById('reportModal').style.display = 'flex';
    }

    async function submitSongReport() {
        if(!currentSong) return;
        const reason = document.getElementById('reportReasonSelect').value;
        const description = document.getElementById('reportDescriptionInput').value.trim();
        if(!reason) return showToast('请选择举报原因', true);
        const payload = {
            songId: currentSong.id,
            songName: currentSong.filename,
            uploader: currentSong.uploader || 'FULLKIK',
            reporter: username || 'Guest',
            reason,
            description: description || '-'
        };
        const res = await fetch(`${API_URL}/reports`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if(res.ok) {
            closeReportModal();
            showToast('举报已提交');
        } else {
            showToast('举报提交失败', true);
        }
    }

    async function toggleFav(songId, event) {
        event.stopPropagation();
        if(!username) return window.location.href = '/register.html';
        
        const isCurrentlyLiked = userFavorites.includes(songId);
        const btn1 = document.getElementById(`fav-btn-${songId}`);
        const btn2 = document.getElementById(`fav-btn-view-${songId}`);
        const btn3 = document.getElementById(`fav-btn-featured-${songId}`);
        if(btn1) btn1.classList.toggle('liked', !isCurrentlyLiked);
        if(btn2) btn2.classList.toggle('liked', !isCurrentlyLiked);
        if(btn3) btn3.classList.toggle('liked', !isCurrentlyLiked);

        const res = await fetch(`${API_URL}/users/${username}/favorites`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ songId }) });
        if(res.ok) {
            const data = await res.json(); userFavorites = data.favorites;
        } else {
            if(btn1) btn1.classList.toggle('liked', isCurrentlyLiked);
            if(btn2) btn2.classList.toggle('liked', isCurrentlyLiked);
            if(btn3) btn3.classList.toggle('liked', isCurrentlyLiked);
        }
    }

    // --- MORE SONGS PAGINATION ---
    let currentMoreSongs = []; let currentMorePage = 1; const MORE_LIMIT = 50;

    function openMoreSongs(title, filterId) {
        document.getElementById('moreSongsTitle').innerText = title;
        if(filterId === 'ALL') currentMoreSongs = [...allSongs].filter(s => s.status === 'APPROVED').sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        else currentMoreSongs = allSongs.filter(s => s.genreId === filterId && s.status === 'APPROVED');
        currentMorePage = 1; renderMoreSongsPage(); switchView('more-songs'); setMusicPageTitle('more-songs', title);
    }

    function setMorePage(num) { currentMorePage = num; renderMoreSongsPage(); }
    function changeMorePage(dir) { currentMorePage += dir; renderMoreSongsPage(); }

    function renderMoreSongsPage() {
        const listDiv = document.getElementById('moreSongsList'); listDiv.innerHTML = '';
        const totalPages = Math.ceil(currentMoreSongs.length / MORE_LIMIT) || 1;
        if(currentMorePage > totalPages) currentMorePage = totalPages;
        const start = (currentMorePage - 1) * MORE_LIMIT; const paged = currentMoreSongs.slice(start, start + MORE_LIMIT);

        paged.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            listDiv.innerHTML += `
                <div class="list-song-row" onclick="openSong('${s.id}')">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">Uploader: ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price||0} <span style="color:#666; margin-left:10px;">♡</span></div>
                </div>
            `;
        });

        const pagDiv = document.getElementById('moreSongsPagination');
        let pagHtml = `<button class="p-btn" ${currentMorePage===1?'disabled':''} onclick="changeMorePage(-1)">« 上一页</button>`;
        for(let i=1; i<=totalPages; i++) {
            if (totalPages > 7) {
                if (i === 1 || i === totalPages || (i >= currentMorePage - 1 && i <= currentMorePage + 1)) pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`;
                else if (i === currentMorePage - 2 || i === currentMorePage + 2) pagHtml += `<span style="color:var(--text-muted);">...</span>`;
            } else { pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`; }
        }
        pagHtml += `<button class="p-btn" ${currentMorePage===totalPages?'disabled':''} onclick="changeMorePage(1)">下一页 »</button>`;
        pagDiv.innerHTML = pagHtml;
    }

    // AUDIO LOGIC
    if(audioEl) {
        audioEl.addEventListener('loadedmetadata', () => { const isP = audioEl.dataset.purchased === 'true'; const displayDur = (!isP && audioEl.duration > 30) ? 30 : audioEl.duration; document.getElementById('playerDur').innerText = formatTime(displayDur); document.getElementById('playerSeek').max = displayDur; });
        audioEl.addEventListener('timeupdate', () => { const isP = audioEl.dataset.purchased === 'true'; if (!isP && audioEl.currentTime >= 30) { audioEl.pause(); audioEl.currentTime = 30; document.getElementById('playerPlayBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; } document.getElementById('playerCurr').innerText = formatTime(audioEl.currentTime); document.getElementById('playerSeek').value = audioEl.currentTime; const baseDur = (!isP && audioEl.duration > 30) ? 30 : audioEl.duration; document.getElementById('playerProg').style.width = `${(audioEl.currentTime / baseDur) * 100}%`; });
        audioEl.addEventListener('ended', () => { document.getElementById('playerPlayBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; document.getElementById('playerSeek').value = 0; document.getElementById('playerProg').style.width = "0%"; });

    function togglePlayerAudio() { const btn = document.getElementById('playerPlayBtn'); if(audioEl.paused) { if(audioEl.dataset.purchased === "false" && audioEl.currentTime >= 30) audioEl.currentTime = 0; audioEl.play(); btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; } else { audioEl.pause(); btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; } }
    function seekPlayerAudio(val) { if(audioEl.dataset.purchased === "false" && val >= 30) val = 29.9; audioEl.currentTime = val; }

    function promptPurchase(songId, songName, filepath, price) { 
        if(!username) return window.location.href = '/register.html'; 
        if(price === 0) return executePurchase(songId, songName, filepath, 0); 
        if(userTokens < price) return showToast("Insufficient tokens!", true); 
        document.getElementById('purchaseContent').innerHTML = `<h3 style="margin:0 0 10px 0;">确认购买</h3><p style="color:var(--text-muted); margin:0; font-size:14px;">"${songName}"</p><div style="font-size:24px; font-weight:bold; color:var(--token); margin-top:15px;">${price} 💎</div>`; 
        document.getElementById('purchaseActions').innerHTML = `<button class="modal-btn cancel" onclick="document.getElementById('purchaseModal').style.display='none'">${dict[currentLang].cancel}</button><button class="modal-btn" onclick="executePurchase('${songId}', '${songName.replace(/'/g, "\\'")}', '${filepath}', ${price})" style="color:var(--accent-light);">确认支付</button>`; 
        document.getElementById('purchaseModal').style.display = 'flex'; 
    }
    
    async function executePurchase(songId, songName, filepath, price) { 
        document.getElementById('purchaseModal').style.display='none';
        
        const res = await fetch(`${API_URL}/users/${username}/purchase`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({songId}) }); 
        if(res.ok) { 
            const data = await res.json(); userTokens = data.tokens; userPurchases = data.purchases; 
            if(document.getElementById('tokenDisplay')) document.getElementById('tokenDisplay').innerText = userTokens; 
            document.getElementById('successPurchaseModal').style.display = 'flex'; 
            setTimeout(() => { document.getElementById('successPurchaseModal').style.display='none'; openSong(songId); }, 2000); 
        } else { const err = await res.text(); if(!err.includes('Not found')) showToast("Purchase Failed", true); } 
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
