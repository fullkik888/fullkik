<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .nav-tabs { display: flex; gap: 30px; align-items: center; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; text-decoration:none;}
        .nav-tab.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .lang-toggle { font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); transition: 0.2s;}
        .lang-toggle:hover { color: white; border-color: white;}

        .header-right { display: flex; align-items: center; gap: 15px; }

        .profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 30px; cursor: pointer; transition: 0.2s; text-decoration: none;}
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }

        /* TOKEN PILL RESTORED IN MUSIC.HTML */
        .token-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; color: var(--token); border: 1px solid var(--border-color); text-decoration:none;}
        .token-pill:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        
        .view-section { display: none; animation: fadeIn 0.4s ease; width: 100%;}
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- GLOBAL LOADERS --- */
        #globalLoader { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px); z-index:999999; align-items:center; justify-content:center; flex-direction:column;}
        @keyframes pulseFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 36px; margin: 0 0 10px 0; font-weight: 700; letter-spacing: 2px;}
        .hero p { color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0;}
        
        /* HOMEPAGE BANNERS */
        .banners-container { display:flex; gap:10px; margin: 0 auto 20px auto; width:100%; max-width:800px; justify-content:center; overflow-x:auto; }
        .banners-container img { width:30%; height:120px; object-fit:cover; border-radius:12px; border:1px solid var(--border-color); }

        /* SEARCH DROPDOWN UI */
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-bar { width: 100%; padding: 16px 24px; border-radius: 30px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: white; font-size: 16px; outline: none; box-sizing: border-box;}
        .search-dropdown { position: absolute; top: calc(100% + 10px); left: 0; width: 100%; background: #1a0f0f; border: 1px solid var(--border-color); border-radius: 12px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; text-align:left;}
        .search-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;}
        .search-item:hover { background: rgba(255,255,255,0.05); }
        .search-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;}
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        
        /* --- HOMEPAGE GRIDS & DJ SCROLL --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-top:40px; margin-bottom: 15px;}
        .section-header h3 { margin: 0; font-size: 20px; font-weight: 700;}
        .section-header span { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 15px; background: rgba(255,255,255,0.05); transition:0.2s;}
        .section-header span:hover { color: white; background: rgba(255,255,255,0.1); }

        .dj-scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
        .dj-scroll-container::-webkit-scrollbar { display: none; }
        .dj-card { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; flex-shrink: 0; position:relative; cursor:pointer;}
        .dj-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); background:#1a0f0f;}
        .dj-rank { position: absolute; top: 0; left: 5px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white;}
        .rank-1 { background: linear-gradient(45deg, #FFD700, #FDB931); border:1px solid #B8860B; }
        .rank-2 { background: linear-gradient(45deg, #C0C0C0, #E0E0E0); border:1px solid #A9A9A9; color:#333;}
        .rank-3 { background: linear-gradient(45deg, #CD7F32, #D2691E); border:1px solid #8B4513; }
        .dj-name { font-size: 12px; font-weight: bold; width:100%; text-align:center;}
        .dj-count { font-size: 10px; color: var(--text-muted); }

        .home-song-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .home-song-row-card { display: flex; align-items: center; gap: 15px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; min-width: 0;}
        .home-song-row-card:hover { border-color: var(--accent-light); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(128,0,0,0.3);}
        .home-song-row-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0;}
        .home-song-row-card .info { flex: 1; min-width: 0; display:flex; flex-direction:column; gap:5px;}
        .home-song-row-card .info .title { font-size: 14px; font-weight: bold; color: white;}
        .home-song-row-card .info .sub { font-size: 11px; color: var(--text-muted);}
        .home-song-row-card .price { font-size: 12px; font-weight: bold; color: var(--token); white-space:nowrap;}

        /* --- RANKING LIST (排行榜) --- */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }
        .ranking-num { width: 30px; font-size: 18px; font-weight: bold; text-align: center; }
        .rank-gold { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-silver { color: #C0C0C0; }
        .rank-bronze { color: #CD7F32; }
        .rank-normal { color: var(--text-muted); }

        .custom-pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .p-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size:13px;}
        .p-btn:hover:not(:disabled) { border-color: var(--accent-light); color: white;}
        .p-btn.active { background: var(--accent-light); color: white; border-color: var(--accent-light);}
        .p-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* PLAYER */
        .player-header { display: flex; align-items: center; margin-bottom: 30px;}
        .btn-back { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;}
        .btn-back:hover { color: white; }
        
        .player-container { display: flex; gap: 40px; background: rgba(255,255,255,0.02); border-radius: 24px; padding: 40px; border: 1px solid var(--border-color); position:relative;}
        .player-left { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0;}
        .player-title { font-size: 32px; font-weight: 700; margin: 0 0 10px 0;}
        .player-meta { color: var(--text-muted); font-size: 14px; margin-bottom: 30px;}
        
        .waveform-ui { width: 100%; height: 60px; display: flex; align-items: center; gap: 3px; margin-bottom: 20px;}
        .wave-bar { flex: 1; background: var(--border-color); border-radius: 2px; transition: 0.2s;}
        
        .audio-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 16px;}
        .play-circle { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .play-circle:hover { transform: scale(1.05); background: var(--accent-light); }
        .play-circle svg { width: 24px; height: 24px; fill: white; }
        
        .slider-container { position: relative; flex: 1; height: 24px; display: flex; align-items: center; }
        .inline-progress-fill { position: absolute; left: 0; height: 4px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 1;}
        input[type=range].seeker { position: absolute; width: 100%; -webkit-appearance: none; background: transparent; z-index: 2; margin: 0; outline: none;}
        input[type=range].seeker::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; cursor: pointer; }
        input[type=range].seeker::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

        .action-row { display: flex; gap: 15px;}
        .btn-buy-big { background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 16px 30px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; display:flex; align-items:center; gap:10px;}
        .btn-buy-big:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(128, 0, 0, 0.4);}
        
        .player-right { width: 350px; flex-shrink: 0; position:relative;}
        .player-cover { width: 100%; aspect-ratio: 1; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);}

        /* --- TOPUP CENTER --- */
        .topup-grid-large { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;}
        .topup-pack { background: #1a0f0f; border: 2px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;}
        .topup-pack.active { border-color: var(--accent-light); background: rgba(128, 0, 0, 0.1); }
        .topup-pack .tag { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: rgba(165, 42, 42, 0.2); color: var(--accent-light); font-size: 10px; font-weight: bold; padding: 2px 10px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;}
        .topup-pack .amt { font-size: 18px; font-weight: bold; margin: 15px 0 5px 0; color: var(--token);}
        .topup-pack .prc { font-size: 14px; color: var(--text-muted);}

        .pay-methods { display: flex; gap: 10px; margin-bottom: 20px;}
        .pay-btn { flex: 1; background: #1a0f0f; border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 13px;}
        .pay-btn.active { border-color: var(--accent-light); color: white;}
        .promo-bar { display: flex; gap: 10px; margin-bottom: 30px;}
        .promo-bar input { flex: 1; background: #1a0f0f; border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 8px; color: white; outline: none;}
        .promo-bar button { background: rgba(255,255,255,0.1); border: none; color: white; padding: 0 20px; border-radius: 8px; cursor: pointer;}
        .topup-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 20px;}
        .btn-submit { background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s;}

        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 8px; transition: 0.2s; display: inline-flex; align-items: center; text-decoration: none;}
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor;}

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;}
        .modal-box { background: rgba(30, 15, 15, 0.95); backdrop-filter: blur(30px); width: 100%; max-width: 380px; border-radius: 24px; text-align: center; border: 1px solid var(--border-color); animation: popIn 0.3s; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8);}
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content { padding: 30px 20px; }
        .modal-actions { display: flex; border-top: 1px solid var(--border-color); }
        .modal-btn { flex: 1; padding: 16px; border: none; background: transparent; font-size: 16px; cursor: pointer; color: #fff; font-weight: 600; transition: 0.2s;}
        .modal-btn.cancel { border-right: 1px solid var(--border-color); color: var(--text-muted); font-weight: 400;}

        @media (max-width: 768px) {
            .header-top { padding: 15px 20px; }
            .player-container { flex-direction: column-reverse; padding: 20px;}
            .player-right { width: 100%; }
            .nav-tabs { gap: 15px; }
            .logo-container { font-size: 18px; }
            .home-song-grid { grid-template-columns: 1fr; } /* Stack on mobile */
            .search-wrapper { max-width: 90%; }
            .banners-container img { width: 250px; flex-shrink: 0;}
            .topup-grid-large { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="globalLoader" class="modal-overlay" style="z-index:99999; flex-direction:column; background: rgba(0,0,0,0.8);">
    <div style="font-size:16px; margin-bottom:15px; color:var(--accent-light); font-weight:bold; letter-spacing:1px; animation: pulseFade 1s infinite;" id="gLoadText">正在处理订单...</div>
</div>

<div id="toast" class="toast"></div>

<div class="header-top">
    <div class="logo-container" id="logoText">FULLKIK</div>
    <div class="nav-tabs">
        <button class="nav-tab active" id="nav-store" onclick="switchView('home')" data-i18n="store">首页</button>
        <button class="nav-tab" id="nav-ranking" onclick="switchView('ranking')" data-i18n="ranking">排行榜</button>
        <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / CN</div>
    </div>
    <div class="header-right">
        <div class="token-pill" onclick="switchView('topup')" id="tokenUI">
            <span style="color:var(--token)">💎</span> <span id="tokenDisplay">0</span><span style="font-weight:normal; margin-left:2px;">+</span>
        </div>
        <div style="position:relative;">
            <a href="/profile.html" class="profile-trigger" id="profileBtn"></a>
        </div>
    </div>
</div>

<div class="container">
    <div id="view-home" class="view-section active">
        <div class="hero">
            <h1 id="heroTitle">专属DJ节奏空间</h1>
            <p data-i18n="heroSub">专属DJ节奏空间 · 电音串烧 · 车载热播 · 精选原创作品</p>
            
            <div id="homeBanners" class="banners-container"></div>

            <div class="search-wrapper">
                <input type="text" class="search-bar" id="mainSearch" placeholder="Search songs..." oninput="handleGlobalSearch(event)">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
        </div>

        <div id="homeContentAreas" style="width:100%;"></div>
    </div>

    <div id="view-ranking" class="view-section">
        <div style="margin-bottom: 30px;">
            <h2 style="font-size:32px; font-weight:800; margin:0;" data-i18n="ranking">排行榜</h2>
            <p style="color:var(--text-muted); margin-top:5px;">下载与购买量 Top 50 热播单曲</p>
        </div>
        <div class="ranking-list" id="rankingList"></div>
    </div>

    <div id="view-more-songs" class="view-section">
        <div class="player-header">
            <button class="btn-back" onclick="switchView('home')"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 返回</button>
            <h2 id="moreSongsTitle" style="margin: 0 0 0 20px;">Category</h2>
        </div>
        <div id="moreSongsList"></div>
        <div class="custom-pagination" id="moreSongsPagination"></div>
    </div>

    <div id="view-song" class="view-section">
        <div class="player-header">
            <button class="btn-back" onclick="switchView('home')"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> <span data-i18n="back">Back</span></button>
        </div>
        <div class="player-container">
            <div class="player-left">
                <h1 class="player-title truncate" id="playerTitle">Song Title</h1>
                <div class="player-meta" id="playerMeta">FULLKIK • MP3 0.0MB</div>
                <div class="waveform-ui" id="waveform"></div>
                <div class="audio-controls">
                    <div class="play-circle" onclick="togglePlayerAudio()" id="playerPlayBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <span class="time-display" id="playerCurr">0:00</span>
                    <div class="slider-container"><input type="range" class="seeker" id="playerSeek" value="0" step="0.1" oninput="seekPlayerAudio(this.value)"><div class="inline-progress-fill" id="playerProg"></div></div>
                    <span class="time-display" id="playerDur">0:00</span>
                </div>
                <div class="action-row" id="playerActions"></div>
            </div>
            <div class="player-right">
                <img class="player-cover" id="playerCover" src="">
                <button style="position:absolute; bottom:20px; right:20px; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px;" onclick="showToast('已举报 (Report Submitted)')"><svg viewBox="0 0 24 24" style="width:14px;fill:currentColor;"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg> <span data-i18n="report">举报</span></button>
            </div>
        </div>
    </div>

    <div id="view-topup" class="view-section">
        <div style="display:flex; align-items:center; gap:20px; margin-bottom:30px; border-bottom:1px solid var(--border-color); padding-bottom:15px;">
            <h2 style="margin:0; cursor:pointer; color:var(--text-main);" data-i18n="pTopup">充值中心</h2>
        </div>
        
        <div class="topup-grid-large" id="topupGridRender"></div>

        <p style="font-size:12px; color:var(--text-muted);">支付方式 (Payment Method)</p>
        <div class="pay-methods">
            <button class="pay-btn active" id="btnCurrRMB" onclick="setCurrency('RMB')">RMB</button>
            <button class="pay-btn" id="btnCurrMYR" onclick="setCurrency('MYR')">MYR</button>
        </div>
        <div class="pay-methods" id="payMethodList"></div>

        <div class="promo-bar"><input type="text" placeholder="促销码 (即将上线)"><button>应用</button></div>

        <div class="topup-footer">
            <div style="color:var(--text-muted); font-size:14px;">总计 (Total)</div>
            <div style="font-size:24px; font-weight:bold;" id="topupTotalDisplay">¥0</div>
        </div>
        <button class="btn-submit" style="margin-top:20px;" onclick="executeRealTopup()">确认支付</button>
    </div>
</div>

<audio id="mainAudio" preload="metadata"></audio>

<div class="modal-overlay" id="purchaseModal"><div class="modal-box"><div class="modal-content" id="purchaseContent"></div><div class="modal-actions" id="purchaseActions"></div></div></div>
<div class="modal-overlay" id="successPurchaseModal"><div class="modal-box" style="padding: 40px 20px;"><svg viewBox="0 0 24 24" style="width:70px; height:70px; fill:var(--accent); margin-bottom: 15px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><h2 style="margin:0; font-size: 20px; letter-spacing: 0.5px;" data-i18n="successBuy">Purchased Successfully!</h2></div></div>

<script>
    const API_URL = '/api';
    let allGenres = [], allSongs = [], userPurchases = [], userFavorites = [];
    let currentGenreId = null, currentSong = null; let userTokens = 0;
    const username = localStorage.getItem('djUsername');
    const audioEl = document.getElementById('mainAudio');
    
    // --- DYNAMIC TOP UP & CURRENCY ENGINE ---
    let currentCurrency = 'RMB';
    let currentTopupAmt = 500, currentTopupPrice = 850;
    const EX_RATE = 0.65; // Approx MYR to RMB conversion
    const packs = [ { t: 500, b: 200, p: 850 }, { t: 400, b: 150, p: 680 }, { t: 300, b: 100, p: 510 }, { t: 200, b: 0, p: 340 }, { t: 100, b: 0, p: 170 }, { t: 50, b: 0, p: 85 } ];

    function setCurrency(curr) {
        currentCurrency = curr;
        document.getElementById('btnCurrRMB').classList.toggle('active', curr === 'RMB');
        document.getElementById('btnCurrMYR').classList.toggle('active', curr === 'MYR');
        
        const methods = curr === 'RMB' ? ['支付宝转账', '微联扫码', '微信原生'] : ['FPX 网上银行', "Touch 'n Go", 'GrabPay', 'Boost'];
        document.getElementById('payMethodList').innerHTML = methods.map((m, i) => `<button class="pay-btn ${i===0?'active':''}">${m}</button>`).join('');
        
        renderTopupPacks();
    }

    function renderTopupPacks() {
        const grid = document.getElementById('topupGridRender'); grid.innerHTML = '';
        packs.forEach((pk, i) => {
            const price = currentCurrency === 'RMB' ? pk.p : Math.round(pk.p * EX_RATE);
            const sym = currentCurrency === 'RMB' ? '¥' : 'RM';
            const bonusStr = pk.b > 0 ? `<div class="tag">限时优惠</div><div class="amt">💎 ${pk.t} + ${pk.b}</div>` : `<div class="amt" style="margin-top:25px;">💎 ${pk.t}</div>`;
            
            grid.innerHTML += `
                <div class="topup-pack ${i===0 ? 'active' : ''}" onclick="selectTopup(${pk.t}, ${pk.b}, ${price}, this)">
                    ${bonusStr}<div class="prc">${sym}${price}</div>
                </div>`;
            if(i === 0) selectTopup(pk.t, pk.b, price, grid.lastElementChild);
        });
    }

    function selectTopup(amt, bonus, price, el) {
        if(el) { document.querySelectorAll('.topup-pack').forEach(c => c.classList.remove('active')); el.classList.add('active'); }
        currentTopupAmt = amt + bonus; currentTopupPrice = price;
        const sym = currentCurrency === 'RMB' ? '¥' : 'RM';
        document.getElementById('topupTotalDisplay').innerText = `${sym}${price}`;
    }

    // --- LANGUAGE SYSTEM ---
    const dict = {
        en: { store: "Store", ranking: "Ranking", pTopup: "Top Up Center", login: "Login", heroSub: "Exclusive DJ Rhythms · Electro · Club Bangers", search: "Search songs...", back: "Back", cancel: "Cancel", successBuy: "Purchased Successfully!", previewLimit: "Login to purchase. Preview limited to 30s.", buyBtn: "BUY", report: "Report" },
        cn: { store: "首页", ranking: "排行榜", pTopup: "充值中心", login: "登录", heroSub: "专属DJ节奏空间 · 电音串烧 · 车载热播 · 精选原创作品", search: "搜索歌曲...", back: "返回", cancel: "取消", successBuy: "购买成功!", previewLimit: "试听只有30秒", buyBtn: "购买", report: "举报" }
    };
    let currentLang = localStorage.getItem('djLang') || 'cn';

    function toggleLang() { currentLang = currentLang === 'en' ? 'cn' : 'en'; localStorage.setItem('djLang', currentLang); applyLang(); }

    function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(dict[currentLang][key]) el.innerText = dict[currentLang][key]; });
        document.querySelectorAll('[data-placeholder]').forEach(el => { const key = el.getAttribute('data-placeholder'); if(dict[currentLang][key]) el.placeholder = dict[currentLang][key]; });
        const mainS = document.getElementById('mainSearch'); if(mainS) mainS.placeholder = dict[currentLang].search;
        if(!username && document.getElementById('profileBtnText')) document.getElementById('profileBtnText').innerText = dict[currentLang].login;
        if(currentSong) openSong(currentSong.id);
        try { const vRank = document.getElementById('view-ranking'); if(vRank && vRank.classList.contains('active')) renderRanking(); } catch(e) {}
    }

    function showGlobalLoader(txt = "正在处理订单...") { document.getElementById('gLoadText').innerText = txt; document.getElementById('globalLoader').style.display = 'flex'; }
    function hideGlobalLoader() { document.getElementById('globalLoader').style.display = 'none'; }
    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.className = 'toast'; if(isError) t.style.borderColor = 'var(--danger)'; t.innerHTML = `<span style="color:${isError ? 'white' : 'var(--accent)'}; font-weight:bold;">${isError ? '!' : '✓'}</span> ${msg}`; t.classList.add('show'); setTimeout(() => {t.classList.remove('show'); t.style.borderColor = 'var(--border-color)';}, 3500); }
    function formatBytes(bytes) { if (!bytes) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k)); return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]; }
    function formatTime(sec) { if(isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0'+s : s}`; }

    // --- SEARCH UI LOGIC ---
    function handleGlobalSearch(e) {
        const query = e.target.value.toLowerCase(); const drop = document.getElementById('searchResults');
        if(!query) { drop.style.display = 'none'; return; }
        const filtered = allSongs.filter(s => s.status === 'APPROVED' && (s.filename.toLowerCase().includes(query) || (s.uploader && s.uploader.toLowerCase().includes(query))));
        drop.innerHTML = '';
        if(filtered.length === 0) { drop.innerHTML = `<div style="padding:15px; color:var(--text-muted); text-align:center;">No results found</div>`; } 
        else {
            filtered.forEach(s => {
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                drop.innerHTML += `<div class="search-item" onclick="openSong('${s.id}')"><img src="${cover}"><div><div class="truncate" style="font-weight:bold; font-size:14px; max-width:400px;">${s.filename}</div><div class="truncate" style="font-size:12px; color:var(--text-muted);">${s.uploader || 'FULLKIK'}</div></div></div>`;
            });
        }
        drop.style.display = 'block';
    }
    document.addEventListener('click', (e) => { const sw = e.target.closest('.search-wrapper'); const dr = document.getElementById('searchResults'); if(!sw && dr) dr.style.display = 'none'; });

    let globalSettings = {};

    // --- INITIALIZATION ---
    async function init() {
        if(!username) { 
            const pb = document.getElementById('profileBtn');
            if(pb) pb.outerHTML = `<button class="btn-upgrade-top" onclick="window.location.href='/register.html'" id="profileBtnText" style="padding: 8px 20px; font-size: 14px;">${dict[currentLang].login}</button>`;
            if(document.getElementById('tokenUI')) document.getElementById('tokenUI').style.display = 'none'; 
        }

        try {
            const res = await fetch(`${API_URL}/settings`);
            if(res.ok) { 
                globalSettings = await res.json(); 
                if(globalSettings.headerTitle) { const lt = document.getElementById('logoText'); if(lt) lt.innerText = globalSettings.headerTitle; } 
                if(globalSettings.heroTitle) { const ht = document.getElementById('heroTitle'); if(ht) ht.innerText = globalSettings.heroTitle; } 
            }

            let allUsers = [];
            if(username) {
                const uRes = await fetch(`${API_URL}/users/${username}`);
                if(uRes.ok) { 
                    const data = await uRes.json(); userTokens = data.tokens || 0; userPurchases = data.purchases || []; userFavorites = data.favorites || [];
                    updateTokenUI(); 
                    const pfpUrl = data.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                    const profBtn = document.getElementById('profileBtn'); if(profBtn) profBtn.innerHTML = `<img id="headerProfilePic" class="profile-pic" src="${pfpUrl}">`;
                } else if(uRes.status === 404) { localStorage.removeItem('djUsername'); window.location.reload(); }
            }
            
            allUsers = await (await fetch(`${API_URL}/all-users`)).json();
            allGenres = await (await fetch(`${API_URL}/genres`)).json(); 
            allSongs = await (await fetch(`${API_URL}/songs`)).json();
            
            setCurrency('RMB'); 
            renderHome(allUsers);
            applyLang(); 
        } catch(e) { console.error("Init Error:", e); } 

        const savedView = localStorage.getItem('djLastView'); if(savedView && document.getElementById(`view-${savedView}`)) switchView(savedView); else switchView('home');
    }

    function switchView(view) {
        if(audioEl) audioEl.pause(); document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const targetView = document.getElementById(`view-${view}`); if(targetView) targetView.classList.add('active');
        
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        if(view === 'home' || view === 'genre' || view === 'song' || view === 'more-songs') { const ns = document.getElementById('nav-store'); if(ns) ns.classList.add('active'); }
        if(view === 'ranking') { const ns = document.getElementById('nav-ranking'); if(ns) ns.classList.add('active'); renderRanking(); }

        if(['home', 'ranking', 'more-songs', 'topup'].includes(view)) localStorage.setItem('djLastView', view);
    }

    // --- HOME RENDERING ---
    function renderHome(users) {
        const banners = globalSettings.banners || [];
        const banDiv = document.getElementById('homeBanners');
        if(banDiv) {
            banDiv.innerHTML = '';
            if(banners.some(b => b)) {
                banners.forEach(b => { if(b) banDiv.innerHTML += `<img src="${b}">`; });
            }
        }

        const container = document.getElementById('homeContentAreas');
        if(!container) return;
        container.innerHTML = '';

        if(users && users.length) {
            const vips = users.filter(u => u.isVip);
            vips.sort((a,b) => {
                const cA = allSongs.filter(s => s.uploader === a.username).length;
                const cB = allSongs.filter(s => s.uploader === b.username).length;
                return cB - cA;
            });

            if(vips.length > 0) {
                let djHtml = `<div class="section-header"><h3>热门 DJ</h3></div><div class="dj-scroll-container">`;
                vips.forEach((v, i) => {
                    const count = allSongs.filter(s => s.uploader === v.username).length;
                    const rClass = i===0 ? 'rank-1' : i===1 ? 'rank-2' : i===2 ? 'rank-3' : '';
                    const pfp = v.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                    djHtml += `
                        <div class="dj-card">
                            ${rClass ? `<div class="dj-rank ${rClass}">${i+1}</div>` : ''}
                            <img src="${pfp}">
                            <div class="dj-name truncate">${v.djName || v.username}</div>
                            <div class="dj-count">${count} 首作品</div>
                        </div>`;
                });
                djHtml += `</div>`;
                container.innerHTML += djHtml;
            }
        }

        let latest = [...allSongs].filter(s => s.status === 'APPROVED').sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        if(latest.length > 0) container.innerHTML += generateSongGridHtml('最新歌曲', latest, 'ALL');

        allGenres.forEach(g => {
            if(g.status === 'DISABLED') return;
            const gSongs = allSongs.filter(s => s.genreId === g.id && s.status === 'APPROVED');
            if(gSongs.length > 0) container.innerHTML += generateSongGridHtml(g.name, gSongs, g.id);
        });
    }

    function generateSongGridHtml(title, songs, filterId) {
        const top9 = songs.slice(0, 9);
        let html = `<div class="section-header"><h3>${title}</h3><span onclick="openMoreSongs('${title}', '${filterId}')">更多 ></span></div><div class="home-song-grid">`;
        top9.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            html += `
                <div class="home-song-row-card" onclick="openSong('${s.id}')">
                    <img src="${cover}">
                    <div class="info">
                        <div class="title truncate">${s.filename}</div>
                        <div class="sub truncate">👑 ${s.uploader || 'FULLKIK'}</div>
                    </div>
                    <div class="price">💎 ${s.price||0} <span style="color:#666; margin-left:5px;">♡</span></div>
                </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    // --- RANKING LIST (排行榜) ---
    function renderRanking() {
        const listDiv = document.getElementById('rankingList');
        listDiv.innerHTML = '';
        
        let rankedSongs = [...allSongs]
            .filter(s => s.status === 'APPROVED')
            .sort((a, b) => (b.downloads || 0) - (a.downloads || 0))
            .slice(0, 50); 

        if(rankedSongs.length === 0) {
            listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无排行榜数据</div>`;
            return;
        }

        rankedSongs.forEach((s, index) => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            const rankClass = index === 0 ? 'rank-gold' : index === 1 ? 'rank-silver' : index === 2 ? 'rank-bronze' : 'rank-normal';
            const isPurchased = username ? userPurchases.some(p => p.songId === s.id) : false;
            
            let priceHtml = '';
            if(isPurchased) {
                priceHtml = `<div style="color:var(--success); font-size:12px; border:1px solid var(--success); padding:2px 8px; border-radius:12px; white-space:nowrap;">已购买</div>`;
            } else if(s.price === 0) {
                priceHtml = `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">免费下载</div>`;
            } else {
                priceHtml = `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price}</div>`;
            }

            listDiv.innerHTML += `
                <div class="list-song-row" onclick="openSong('${s.id}')">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <div class="ranking-num ${rankClass}">${index + 1}</div>
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">👑 ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px; flex-shrink:0;">
                        ${priceHtml}
                        <svg viewBox="0 0 24 24" style="width:18px; fill:none; stroke:var(--text-muted); stroke-width:2;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                </div>
            `;
        });
    }

    // --- MORE SONGS PAGINATION ---
    let currentMoreSongs = []; let currentMorePage = 1; const MORE_LIMIT = 50;

    function openMoreSongs(title, filterId) {
        document.getElementById('moreSongsTitle').innerText = title;
        if(filterId === 'ALL') currentMoreSongs = [...allSongs].filter(s => s.status === 'APPROVED').sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        else currentMoreSongs = allSongs.filter(s => s.genreId === filterId && s.status === 'APPROVED');
        currentMorePage = 1; renderMoreSongsPage(); switchView('more-songs');
    }

    function setMorePage(num) { currentMorePage = num; renderMoreSongsPage(); }
    function changeMorePage(dir) { currentMorePage += dir; renderMoreSongsPage(); }

    function renderMoreSongsPage() {
        const listDiv = document.getElementById('moreSongsList'); listDiv.innerHTML = '';
        const totalPages = Math.ceil(currentMoreSongs.length / MORE_LIMIT) || 1;
        if(currentMorePage > totalPages) currentMorePage = totalPages;
        const start = (currentMorePage - 1) * MORE_LIMIT; const paged = currentMoreSongs.slice(start, start + MORE_LIMIT);

        paged.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            listDiv.innerHTML += `
                <div class="list-song-row" onclick="openSong('${s.id}')">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">👑 ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price||0} <span style="color:#666; margin-left:10px;">♡</span></div>
                </div>
            `;
        });

        const pagDiv = document.getElementById('moreSongsPagination');
        let pagHtml = `<button class="p-btn" ${currentMorePage===1?'disabled':''} onclick="changeMorePage(-1)">« 上一页</button>`;
        for(let i=1; i<=totalPages; i++) {
            if (totalPages > 7) {
                if (i === 1 || i === totalPages || (i >= currentMorePage - 1 && i <= currentMorePage + 1)) pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`;
                else if (i === currentMorePage - 2 || i === currentMorePage + 2) pagHtml += `<span style="color:var(--text-muted);">...</span>`;
            } else { pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`; }
        }
        pagHtml += `<button class="p-btn" ${currentMorePage===totalPages?'disabled':''} onclick="changeMorePage(1)">下一页 »</button>`;
        pagDiv.innerHTML = pagHtml;
    }

    // --- FAVORITES LOGIC ---
    async function toggleFavorite(songId) {
        if(!username) return window.location.href = '/register.html';
        const isFav = userFavorites.includes(songId);
        
        // Optimistic UI update
        const svg = document.getElementById(`heart-${songId}`);
        if(svg) {
            if(isFav) { svg.setAttribute('fill', 'none'); userFavorites = userFavorites.filter(id => id !== songId); showToast("取消收藏 (Removed from Favorites)"); }
            else { svg.setAttribute('fill', 'var(--danger)'); userFavorites.push(songId); showToast("收藏成功 (Added to Favorites)"); }
        }

        // Backend Sync
        try { await fetch(`${API_URL}/users/${username}/toggle-favorite`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({songId}) }); } catch(e) { console.error(e); }
    }

    // --- GENRES & SONGS ---
    function openSong(id) {
        currentSong = allSongs.find(s => s.id === id); if(!currentSong) return;
        const isPurchased = username ? userPurchases.some(p => p.songId === id) : false;
        const isFav = userFavorites.includes(id);
        
        document.getElementById('playerTitle').innerText = currentSong.filename;
        document.getElementById('playerMeta').innerText = `${currentSong.uploader || 'FULLKIK'} • ${currentSong.filename.split('.').pop().toUpperCase()} ${formatBytes(currentSong.size)}`;
        document.getElementById('playerCover').src = currentSong.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
        
        const price = currentSong.price || 0; const actionsDiv = document.getElementById('playerActions');
        
        const favBtn = `<button style="background:rgba(255,255,255,0.05); border:1px solid var(--border-color); color:var(--text-main); padding:0 15px; border-radius:12px; cursor:pointer; transition:0.2s;" onclick="toggleFavorite('${id}')"><svg id="heart-${id}" viewBox="0 0 24 24" style="width:20px; height:20px; vertical-align:middle; transition:0.2s;" fill="${isFav ? 'var(--danger)' : 'none'}" stroke="var(--danger)" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>`;

        if(isPurchased) { 
            actionsDiv.innerHTML = `
                <a href="/api/stream/${currentSong.id}" download="${currentSong.filename}" style="text-decoration:none;" class="btn-buy-big"><svg viewBox="0 0 24 24" style="width:20px;fill:white;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 下载歌曲</a>
                <div style="background:rgba(255,255,255,0.05); border:1px solid var(--border-color); color:var(--text-muted); padding:0 20px; border-radius:12px; font-size:14px; font-weight:bold; display:flex; align-items:center; cursor:default;">已购买</div>
                ${favBtn}
            `; 
        } else {
            const btnText = price === 0 ? "免费下载" : `购买 💎 ${price}`;
            actionsDiv.innerHTML = `
                <button class="btn-buy-big" onclick="promptPurchase('${id}', '${currentSong.filename.replace(/'/g, "\\'")}', '/api/stream/${currentSong.id}', ${price})">
                    ${btnText}
                </button>
                ${favBtn}
                <div style="display:flex;align-items:center;margin-left:5px;color:var(--text-muted);font-size:12px;">${dict[currentLang].previewLimit}</div>
            `;
        }

        audioEl.src = `/api/stream/${currentSong.id}`; audioEl.dataset.purchased = isPurchased; document.getElementById('playerPlayBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; document.getElementById('playerSeek').value = 0; document.getElementById('playerProg').style.width = '0%';
        switchView('song');
    }

    // AUDIO LOGIC
    if(audioEl) {
        audioEl.addEventListener('loadedmetadata', () => { const isP = audioEl.dataset.purchased === 'true'; const displayDur = (!isP && audioEl.duration > 30) ? 30 : audioEl.duration; document.getElementById('playerDur').innerText = formatTime(displayDur); document.getElementById('playerSeek').max = displayDur; });
        audioEl.addEventListener('timeupdate', () => { const isP = audioEl.dataset.purchased === 'true'; if (!isP && audioEl.currentTime >= 30) { audioEl.pause(); audioEl.currentTime = 30; document.getElementById('playerPlayBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; } document.getElementById('playerCurr').innerText = formatTime(audioEl.currentTime); document.getElementById('playerSeek').value = audioEl.currentTime; const baseDur = (!isP && audioEl.duration > 30) ? 30 : audioEl.duration; document.getElementById('playerProg').style.width = `${(audioEl.currentTime / baseDur) * 100}%`; });
        audioEl.addEventListener('ended', () => { document.getElementById('playerPlayBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; document.getElementById('playerSeek').value = 0; document.getElementById('playerProg').style.width = "0%"; });
    }
    function togglePlayerAudio() { const btn = document.getElementById('playerPlayBtn'); if(audioEl.paused) { if(audioEl.dataset.purchased === "false" && audioEl.currentTime >= 30) audioEl.currentTime = 0; audioEl.play(); btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; } else { audioEl.pause(); btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; } }
    function seekPlayerAudio(val) { if(audioEl.dataset.purchased === "false" && val >= 30) val = 29.9; audioEl.currentTime = val; }

    function updateTokenUI() { if(document.getElementById('tokenDisplay')) document.getElementById('tokenDisplay').innerText = userTokens; }
    
    async function executeRealTopup() {
        showGlobalLoader("正在处理订单...");
        const res = await fetch(`${API_URL}/users/${username}/topup`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ amount: currentTopupAmt, price: currentTopupPrice, currency: currentCurrency }) });
        if(res.ok) { const data = await res.json(); userTokens = data.tokens; updateTokenUI(); hideGlobalLoader(); showToast(`充值完成！`); } else { hideGlobalLoader(); showToast("Top up failed", true); }
    }

    function promptPurchase(songId, songName, filepath, price) { 
        if(!username) return window.location.href = '/register.html'; 
        if(price === 0) return executePurchase(songId, songName, filepath, 0); // Free songs skip the prompt
        if(userTokens < price) return showToast("Insufficient tokens!", true); 
        document.getElementById('purchaseContent').innerHTML = `<h3 style="margin:0 0 10px 0;">Confirm Purchase</h3><p style="color:var(--text-muted); margin:0; font-size:14px;">"${songName}"</p><div style="font-size:24px; font-weight:bold; color:var(--token); margin-top:15px;">${price} Tokens</div>`; 
        document.getElementById('purchaseActions').innerHTML = `<button class="modal-btn cancel" onclick="closeModals()">${dict[currentLang].cancel}</button><button class="modal-btn" onclick="executePurchase('${songId}', '${songName.replace(/'/g, "\\'")}', '${filepath}', ${price})" style="color:var(--accent-light);">Confirm</button>`; 
        document.getElementById('purchaseModal').style.display = 'flex'; 
    }
    
    async function executePurchase(songId, songName, filepath, price) { 
        showGlobalLoader("正在处理订单..."); document.getElementById('purchaseActions').innerHTML = ''; 
        const res = await fetch(`${API_URL}/users/${username}/purchase`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({songId}) }); 
        if(res.ok) { 
            const data = await res.json(); userTokens = data.tokens; userPurchases = data.purchases; updateTokenUI(); 
            closeModals(); hideGlobalLoader(); document.getElementById('successPurchaseModal').style.display = 'flex'; 
            setTimeout(() => { closeModals(); openSong(songId); }, 2000); 
        } else { hideGlobalLoader(); closeModals(); const err = await res.text(); if(!err.includes('Not found')) showToast("Purchase Failed", true); } 
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
