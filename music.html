<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: rgba(30, 15, 15, 0.8); --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #251010 0%, #0b0b0b 70%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration:none;}
        .nav-tabs { display: flex; gap: 30px; align-items: center; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; outline: none; }
        .nav-tab.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .lang-toggle { font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); transition: 0.2s;}
        .lang-toggle:hover { color: white; border-color: white;}

        .header-right { display: flex; align-items: center; gap: 15px; }
        .profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 30px; cursor: pointer; transition: 0.2s;}
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }
        .token-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; color: var(--token); border: 1px solid var(--border-color);}
        .token-pill:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        .container { width: 100%; max-width: 1200px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        
        .view-section { display: none; animation: fadeIn 0.4s ease; width: 100%;}
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SPLASH LOADER --- */
        @keyframes heartbeat { 0%, 100% { transform: rotate(-90deg) scale(1); } 50% { transform: rotate(-90deg) scale(1.1); } }
        #initLoadCircle { transform-origin: 50% 50%; animation: heartbeat 1s infinite ease-in-out; }
        #splashLoader { display:flex; position:fixed; inset:0; background:rgba(11, 11, 11, 0.8); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); z-index:9999999; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease; }
        .splash-circle-wrap { position:relative; width:80px; height:80px; display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
        .splash-text { font-size:14px; font-weight:bold; color:var(--text-muted); letter-spacing:2px; animation: pulseFade 1.5s infinite; }
        
        .welcome-text { display:none; font-size:28px; font-weight:900; letter-spacing:8px; color:var(--text-main); margin-top:20px;}
        .welcome-text span { display:inline-block; opacity:0; transform:translateY(20px); animation: popUp 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .welcome-text span:nth-child(1) { animation-delay: 0.1s; } .welcome-text span:nth-child(2) { animation-delay: 0.2s; } .welcome-text span:nth-child(3) { animation-delay: 0.3s; } .welcome-text span:nth-child(4) { animation-delay: 0.4s; }
        .welcome-text span:nth-child(5) { animation-delay: 0.5s; } .welcome-text span:nth-child(6) { animation-delay: 0.6s; } .welcome-text span:nth-child(7) { animation-delay: 0.7s; } .welcome-text span:nth-child(8) { animation-delay: 0.8s; }
        .welcome-text span:nth-child(9) { animation-delay: 0.9s; } .welcome-text span:nth-child(10) { animation-delay: 1.0s; } .welcome-text span:nth-child(11) { animation-delay: 1.1s; }
        
        @keyframes pulseFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes popUp { to { opacity:1; transform:translateY(0); } }

        /* --- GLOBAL LOADERS --- */
        #globalLoader { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px); z-index:999999; align-items:center; justify-content:center; flex-direction:column;}
        .content-loader-bar-wrap { width:200px; height:4px; background:rgba(255,255,255,0.05); border-radius:4px; overflow:hidden; border:1px solid var(--border-color); margin: 0 auto;}
        .loader-bar-fill { width:0%; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-light)); transition:width 0.1s linear; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }

        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 36px; margin: 0 0 10px 0; font-weight: 700; letter-spacing: 2px;}
        .hero p { color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0;}
        
        /* HOMEPAGE BANNERS */
        .banners-container { display:flex; gap:10px; margin: 0 auto 20px auto; width:100%; max-width:800px; justify-content:center; overflow-x:auto; }
        .banners-container img { width:30%; height:120px; object-fit:cover; border-radius:12px; border:1px solid var(--border-color); }
        @media (max-width:768px) { .banners-container img { width: 250px; flex-shrink: 0;} }

        /* SEARCH DROPDOWN UI */
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-bar { width: 100%; padding: 16px 24px; border-radius: 30px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: white; font-size: 16px; outline: none; box-sizing: border-box;}
        .search-dropdown { position: absolute; top: calc(100% + 10px); left: 0; width: 100%; background: #1a0f0f; border: 1px solid var(--border-color); border-radius: 12px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; text-align:left;}
        .search-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;}
        .search-item:hover { background: rgba(255,255,255,0.05); }
        .search-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;}
        
        /* --- HOMEPAGE GRIDS & DJ SCROLL --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-top:40px; margin-bottom: 15px;}
        .section-header h3 { margin: 0; font-size: 20px; font-weight: 700;}
        .section-header span { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 15px; background: rgba(255,255,255,0.05); transition:0.2s;}
        .section-header span:hover { color: white; background: rgba(255,255,255,0.1); }

        .dj-scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
        .dj-scroll-container::-webkit-scrollbar { display: none; }
        .dj-card { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; flex-shrink: 0; position:relative; cursor:pointer;}
        .dj-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); background:#1a0f0f;}
        .dj-rank { position: absolute; top: 0; left: 5px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white;}
        .rank-1 { background: linear-gradient(45deg, #FFD700, #FDB931); border:1px solid #B8860B; }
        .rank-2 { background: linear-gradient(45deg, #C0C0C0, #E0E0E0); border:1px solid #A9A9A9; color:#333;}
        .rank-3 { background: linear-gradient(45deg, #CD7F32, #D2691E); border:1px solid #8B4513; }
        .dj-name { font-size: 12px; font-weight: bold; width:100%; text-align:center;}
        .dj-count { font-size: 10px; color: var(--text-muted); }

        /* Strict 3x3 Grid Layout */
        .home-song-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .home-song-row-card { display: flex; align-items: center; gap: 15px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; min-width: 0;}
        .home-song-row-card:hover { border-color: var(--accent-light); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(128,0,0,0.3);}
        .home-song-row-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0;}
        .home-song-row-card .info { flex: 1; min-width: 0; display:flex; flex-direction:column; gap:5px;}
        .home-song-row-card .info .title { font-size: 14px; font-weight: bold; color: white;}
        .home-song-row-card .info .sub { font-size: 11px; color: var(--text-muted);}
        .home-song-row-card .price { font-size: 12px; font-weight: bold; color: var(--token); white-space:nowrap;}

        /* --- RANKING LIST (排行榜) --- */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .list-song-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor:pointer; transition:0.2s;}
        .list-song-row:hover { border-color: var(--accent); }
        .ranking-num { width: 30px; font-size: 18px; font-weight: bold; text-align: center; }
        .rank-gold { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-silver { color: #C0C0C0; }
        .rank-bronze { color: #CD7F32; }
        .rank-normal { color: var(--text-muted); }

        .custom-pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .p-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size:13px;}
        .p-btn:hover:not(:disabled) { border-color: var(--accent-light); color: white;}
        .p-btn.active { background: var(--accent-light); color: white; border-color: var(--accent-light);}
        .p-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) {
            .header-top { padding: 15px 20px; }
            .home-song-grid { grid-template-columns: 1fr; } /* Stack on mobile */
            .nav-tabs { gap: 15px; }
            .search-wrapper { max-width: 90%; }
        }
    </style>
</head>
<body>

<div id="splashLoader">
    <div class="splash-circle-wrap">
        <svg width="80" height="80" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#2a1515" stroke-width="6"></circle>
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent-light)" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="283" id="initLoadCircle" style="transition: stroke-dashoffset 0.1s; transform: rotate(-90deg); transform-origin: 50% 50%;"></circle>
        </svg>
    </div>
    <div class="splash-text" id="initLoadText">加载中 >.<</div>
    <div class="welcome-text" id="welcomeText"><span>欢</span><span>迎</span><span>来</span><span>到</span><span>F</span><span>U</span><span>L</span><span>L</span><span>K</span><span>I</span><span>K</span></div>
</div>

<div id="globalLoader" style="z-index:99999; flex-direction:column; background: rgba(0,0,0,0.8); position:fixed; inset:0;">
    <div style="font-size:16px; margin-bottom:15px; color:var(--accent-light); font-weight:bold; letter-spacing:1px; animation: pulseFade 1s infinite;" id="gLoadText">正在处理订单...</div>
</div>

<div id="toast" class="toast"></div>

<div class="header-top">
    <a href="/" class="logo-container" id="logoText">FULLKIK</a>
    <div class="nav-tabs">
        <button class="nav-tab active" id="nav-store" onclick="switchView('home')" data-i18n="store">首页</button>
        <button class="nav-tab" id="nav-ranking" onclick="switchView('ranking')" data-i18n="ranking">排行榜</button>
        <button class="nav-tab" id="nav-library" onclick="window.location.href='/profile.html'" data-i18n="library">我的音乐</button>
        <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / CN</div>
    </div>
    <div class="header-right">
        <div class="token-pill" onclick="window.location.href='/profile.html'" id="tokenUI">
            <svg viewBox="0 0 24 24" style="width:16px; fill:currentColor;"><path d="M12 2l-5.5 9h11zM12 22l-5.5-9h11z"/></svg>
            <span id="tokenDisplay">0</span><span style="font-weight:normal; margin-left:2px;">+</span>
        </div>
        <div class="profile-trigger" id="profileBtn" onclick="window.location.href='/profile.html'"></div>
    </div>
</div>

<div class="container">
    <div id="view-home" class="view-section active">
        <div class="hero">
            <h1 id="heroTitle">专属DJ节奏空间</h1>
            <p data-i18n="heroSub">专属DJ节奏空间 · 电音串烧 · 车载热播 · 精选原创作品</p>
            
            <div id="homeBanners" class="banners-container"></div>

            <div class="search-wrapper">
                <input type="text" class="search-bar" id="mainSearch" placeholder="Search songs..." oninput="handleGlobalSearch(event)">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
        </div>

        <div id="homeContentAreas" style="width:100%;"></div>
    </div>

    <div id="view-ranking" class="view-section">
        <div style="margin-bottom: 30px;">
            <h2 style="font-size:32px; font-weight:800; margin:0;" data-i18n="ranking">排行榜</h2>
            <p style="color:var(--text-muted); margin-top:5px;">下载与购买量 Top 50 热播单曲</p>
        </div>
        <div class="ranking-list" id="rankingList"></div>
    </div>

    <div id="view-more-songs" class="view-section">
        <div style="display: flex; align-items: center; margin-bottom: 30px;">
            <button class="btn-back" onclick="switchView('home')"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 返回</button>
            <h2 id="moreSongsTitle" style="margin: 0 0 0 20px;">Category</h2>
        </div>
        <div id="moreSongsList" class="ranking-list"></div>
        <div class="custom-pagination" id="moreSongsPagination"></div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let allGenres = [], allSongs = [], userPurchases = [];
    let currentGenreId = null; let userTokens = 0;
    const username = localStorage.getItem('djUsername');
    
    // --- LANGUAGE SYSTEM ---
    const dict = {
        en: { store: "Store", ranking: "Ranking", library: "My Uploads", heroSub: "Exclusive DJ Rhythms · Electro · Club Bangers", search: "Search songs...", login: "Login" },
        cn: { store: "首页", ranking: "排行榜", library: "我的音乐", heroSub: "专属DJ节奏空间 · 电音串烧 · 车载热播 · 精选原创作品", search: "搜索歌曲...", login: "登录" }
    };
    let currentLang = localStorage.getItem('djLang') || 'cn';

    function toggleLang() { currentLang = currentLang === 'en' ? 'cn' : 'en'; localStorage.setItem('djLang', currentLang); applyLang(); }

    function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(dict[currentLang][key]) el.innerText = dict[currentLang][key]; });
        const mainS = document.getElementById('mainSearch'); if(mainS) mainS.placeholder = dict[currentLang].search;
        if(!username && document.getElementById('profileBtnText')) document.getElementById('profileBtnText').innerText = dict[currentLang].login;
    }

    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.className = 'toast'; if(isError) t.style.borderColor = 'var(--danger)'; t.innerHTML = `<span style="color:${isError ? 'white' : 'var(--accent)'}; font-weight:bold;">${isError ? '!' : '✓'}</span> ${msg}`; t.classList.add('show'); setTimeout(() => {t.classList.remove('show'); t.style.borderColor = 'var(--border-color)';}, 3500); }

    // --- SEARCH UI LOGIC ---
    function handleGlobalSearch(e) {
        const query = e.target.value.toLowerCase(); const drop = document.getElementById('searchResults');
        if(!query) { drop.style.display = 'none'; return; }
        
        const filtered = allSongs.filter(s => s.status === 'APPROVED' && (s.filename.toLowerCase().includes(query) || (s.uploader && s.uploader.toLowerCase().includes(query))));
        drop.innerHTML = '';
        if(filtered.length === 0) { drop.innerHTML = `<div style="padding:15px; color:var(--text-muted); text-align:center;">No results found</div>`; } 
        else {
            filtered.forEach(s => {
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                drop.innerHTML += `<div class="search-item" onclick="window.location.href='/profile.html?song=${s.id}'"><img src="${cover}"><div><div class="truncate" style="font-weight:bold; font-size:14px; max-width:400px;">${s.filename}</div><div class="truncate" style="font-size:12px; color:var(--text-muted);">${s.uploader || 'FULLKIK'}</div></div></div>`;
            });
        }
        drop.style.display = 'block';
    }
    document.addEventListener('click', (e) => { const sw = e.target.closest('.search-wrapper'); const dr = document.getElementById('searchResults'); if(!sw && dr) dr.style.display = 'none'; });

    let globalSettings = {};

    // --- INITIALIZATION ---
    async function init() {
        const circle = document.getElementById('initLoadCircle');
        let loadProgress = 0; function setProg(p) { if(circle) circle.style.strokeDashoffset = 283 - (283 * p / 100); }
        setProg(10);
        
        if(!username) { 
            const pb = document.getElementById('profileBtn');
            if(pb) pb.outerHTML = `<button class="btn-upgrade-top" onclick="window.location.href='/register.html'" id="profileBtnText" style="padding: 8px 20px; font-size: 14px;">${dict[currentLang].login}</button>`;
            if(document.getElementById('tokenUI')) document.getElementById('tokenUI').style.display = 'none'; 
            if(document.getElementById('nav-library')) document.getElementById('nav-library').style.display = 'none';
        }

        try {
            const res = await fetch(`${API_URL}/settings`);
            if(res.ok) { 
                globalSettings = await res.json(); 
                if(globalSettings.headerTitle) { const lt = document.getElementById('logoText'); if(lt) lt.innerText = globalSettings.headerTitle; } 
                if(globalSettings.heroTitle) { const ht = document.getElementById('heroTitle'); if(ht) ht.innerText = globalSettings.heroTitle; } 
            }
            setProg(30);

            let allUsers = [];
            if(username) {
                const uRes = await fetch(`${API_URL}/users/${username}`);
                if(uRes.ok) { 
                    const data = await uRes.json(); userTokens = data.tokens || 0; userPurchases = data.purchases || [];
                    document.getElementById('tokenDisplay').innerText = userTokens; 
                    const pfpUrl = data.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                    const profBtn = document.getElementById('profileBtn'); if(profBtn) profBtn.innerHTML = `<img id="headerProfilePic" class="profile-pic" src="${pfpUrl}">`;
                } else if(uRes.status === 404) { localStorage.removeItem('djUsername'); window.location.reload(); }
            }
            setProg(50);
            
            allUsers = await (await fetch(`${API_URL}/all-users`)).json(); setProg(60);
            allGenres = await (await fetch(`${API_URL}/genres`)).json(); setProg(75);
            allSongs = await (await fetch(`${API_URL}/songs`)).json(); setProg(100);
            
            renderHome(allUsers);
            applyLang(); 
        } catch(e) { console.error("Init Error:", e); } 

        // Splash Loader Sequence
        setTimeout(() => {
            const ilt = document.getElementById('initLoadText'); if(ilt) ilt.style.display = 'none'; 
            const scw = document.querySelector('.splash-circle-wrap'); if(scw) scw.style.display = 'none';
            const wt = document.getElementById('welcomeText'); if(wt) wt.style.display = 'block';
            setTimeout(() => { 
                const sp = document.getElementById('splashLoader'); 
                if(sp) { sp.style.opacity = 0; setTimeout(() => sp.style.display = 'none', 800); }
                const savedView = localStorage.getItem('djLastView'); if(savedView && document.getElementById(`view-${savedView}`)) switchView(savedView); else switchView('home');
            }, 1500);
        }, 400);
    }

    function switchView(view) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const targetView = document.getElementById(`view-${view}`); if(targetView) targetView.classList.add('active');
        
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        if(view === 'home' || view === 'more-songs') { const ns = document.getElementById('nav-store'); if(ns) ns.classList.add('active'); }
        if(view === 'ranking') { const ns = document.getElementById('nav-ranking'); if(ns) ns.classList.add('active'); renderRanking(); }

        if(['home', 'ranking'].includes(view)) localStorage.setItem('djLastView', view);
    }

    // --- HOME RENDERING ---
    function renderHome(users) {
        const banners = globalSettings.banners || [];
        const banDiv = document.getElementById('homeBanners');
        if(banDiv) {
            banDiv.innerHTML = '';
            if(banners.some(b => b)) { banners.forEach(b => { if(b) banDiv.innerHTML += `<img src="${b}">`; }); }
        }

        const container = document.getElementById('homeContentAreas');
        if(!container) return;
        container.innerHTML = '';

        if(users && users.length) {
            const vips = users.filter(u => u.isVip);
            vips.sort((a,b) => {
                const cA = allSongs.filter(s => s.uploader === a.username).length;
                const cB = allSongs.filter(s => s.uploader === b.username).length;
                return cB - cA;
            });

            if(vips.length > 0) {
                let djHtml = `<div class="section-header"><h3>热门 DJ</h3></div><div class="dj-scroll-container">`;
                vips.forEach((v, i) => {
                    const count = allSongs.filter(s => s.uploader === v.username).length;
                    const rClass = i===0 ? 'rank-1' : i===1 ? 'rank-2' : i===2 ? 'rank-3' : '';
                    const pfp = v.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                    djHtml += `
                        <div class="dj-card" onclick="window.location.href='/profile.html?dj=${v.username}'">
                            ${rClass ? `<div class="dj-rank ${rClass}">${i+1}</div>` : ''}
                            <img src="${pfp}">
                            <div class="dj-name truncate">${v.djName || v.username}</div>
                            <div class="dj-count">${count} 首作品</div>
                        </div>`;
                });
                djHtml += `</div>`;
                container.innerHTML += djHtml;
            }
        }

        let latest = [...allSongs].filter(s => s.status === 'APPROVED').sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        if(latest.length > 0) container.innerHTML += generateSongGridHtml('最新歌曲', latest, 'ALL');

        allGenres.forEach(g => {
            if(g.status === 'DISABLED') return;
            const gSongs = allSongs.filter(s => s.genreId === g.id && s.status === 'APPROVED');
            if(gSongs.length > 0) container.innerHTML += generateSongGridHtml(g.name, gSongs, g.id);
        });
    }

    function generateSongGridHtml(title, songs, filterId) {
        const top9 = songs.slice(0, 9);
        let html = `<div class="section-header"><h3>${title}</h3><span onclick="openMoreSongs('${title}', '${filterId}')">更多 ></span></div><div class="home-song-grid">`;
        top9.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            html += `
                <div class="home-song-row-card" onclick="window.location.href='/profile.html?song=${s.id}'">
                    <img src="${cover}">
                    <div class="info">
                        <div class="title truncate">${s.filename}</div>
                        <div class="sub truncate">👑 ${s.uploader || 'FULLKIK'}</div>
                    </div>
                    <div class="price">💎 ${s.price||0} <span style="color:#666; margin-left:5px;">♡</span></div>
                </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    // --- RANKING LIST (排行榜) ---
    function renderRanking() {
        const listDiv = document.getElementById('rankingList');
        listDiv.innerHTML = '';
        
        let rankedSongs = [...allSongs]
            .filter(s => s.status === 'APPROVED')
            .sort((a, b) => (b.downloads || 0) - (a.downloads || 0))
            .slice(0, 50); 

        if(rankedSongs.length === 0) { listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无排行榜数据</div>`; return; }

        rankedSongs.forEach((s, index) => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            const rankClass = index === 0 ? 'rank-gold' : index === 1 ? 'rank-silver' : index === 2 ? 'rank-bronze' : 'rank-normal';
            const isPurchased = username ? userPurchases.some(p => p.songId === s.id) : false;
            
            let priceHtml = '';
            if(isPurchased) { priceHtml = `<div style="color:var(--success); font-size:12px; border:1px solid var(--success); padding:2px 8px; border-radius:12px; white-space:nowrap;">已购买</div>`; } 
            else if(s.price === 0) { priceHtml = `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">免费下载</div>`; } 
            else { priceHtml = `<div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price}</div>`; }

            listDiv.innerHTML += `
                <div class="list-song-row" onclick="window.location.href='/profile.html?song=${s.id}'">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <div class="ranking-num ${rankClass}">${index + 1}</div>
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">👑 ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px; flex-shrink:0;">
                        ${priceHtml}
                        <svg viewBox="0 0 24 24" style="width:18px; fill:none; stroke:var(--text-muted); stroke-width:2;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                </div>
            `;
        });
    }

    // --- MORE SONGS PAGINATION ---
    let currentMoreSongs = []; let currentMorePage = 1; const MORE_LIMIT = 50;

    function openMoreSongs(title, filterId) {
        document.getElementById('moreSongsTitle').innerText = title;
        if(filterId === 'ALL') currentMoreSongs = [...allSongs].filter(s => s.status === 'APPROVED').sort((a,b) => new Date(b.uploadTime) - new Date(a.uploadTime));
        else currentMoreSongs = allSongs.filter(s => s.genreId === filterId && s.status === 'APPROVED');
        currentMorePage = 1; renderMoreSongsPage(); switchView('more-songs');
    }

    function setMorePage(num) { currentMorePage = num; renderMoreSongsPage(); }
    function changeMorePage(dir) { currentMorePage += dir; renderMoreSongsPage(); }

    function renderMoreSongsPage() {
        const listDiv = document.getElementById('moreSongsList'); listDiv.innerHTML = '';
        const totalPages = Math.ceil(currentMoreSongs.length / MORE_LIMIT) || 1;
        if(currentMorePage > totalPages) currentMorePage = totalPages;
        const start = (currentMorePage - 1) * MORE_LIMIT; const paged = currentMoreSongs.slice(start, start + MORE_LIMIT);

        paged.forEach(s => {
            const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
            listDiv.innerHTML += `
                <div class="list-song-row" onclick="window.location.href='/profile.html?song=${s.id}'">
                    <div style="display:flex; align-items:center; gap:15px; width:70%;">
                        <img src="${cover}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight:bold; font-size:15px;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px; color:var(--text-muted);">👑 ${s.uploader || 'FULLKIK'}</div>
                        </div>
                    </div>
                    <div style="color:var(--token); font-weight:bold; white-space:nowrap;">💎 ${s.price||0} <span style="color:#666; margin-left:10px;">♡</span></div>
                </div>
            `;
        });

        const pagDiv = document.getElementById('moreSongsPagination');
        let pagHtml = `<button class="p-btn" ${currentMorePage===1?'disabled':''} onclick="changeMorePage(-1)">« 上一页</button>`;
        for(let i=1; i<=totalPages; i++) {
            if (totalPages > 7) {
                if (i === 1 || i === totalPages || (i >= currentMorePage - 1 && i <= currentMorePage + 1)) pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`;
                else if (i === currentMorePage - 2 || i === currentMorePage + 2) pagHtml += `<span style="color:var(--text-muted);">...</span>`;
            } else { pagHtml += `<button class="p-btn ${i===currentMorePage?'active':''}" onclick="setMorePage(${i})">${i}</button>`; }
        }
        pagHtml += `<button class="p-btn" ${currentMorePage===totalPages?'disabled':''} onclick="changeMorePage(1)">下一页 »</button>`;
        pagDiv.innerHTML = pagHtml;
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
