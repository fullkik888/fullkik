<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULLKIK - Profile Center</title>
    <style>
        :root { --bg-color: #0b0b0b; --text-main: #ffffff; --text-muted: #a0a0a0; --card-bg: #150a0a; --border-color: rgba(255, 255, 255, 0.1); --accent: #800000; --accent-light: #a52a2a; --danger: #ff453a; --token: #ffffff;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color-scheme: dark;}
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* HEADER */
        .header-top { width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 100; background: rgba(11, 11, 11, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);}
        .logo-container { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(90deg, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        
        .header-right { display: flex; align-items: center; gap: 15px; }

        .container { width: 100%; max-width: 900px; padding: 100px 20px 40px 20px; box-sizing: border-box; }
        .view-section { display: none; animation: fadeIn 0.3s ease; width: 100%;}
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* PROFILE LAYOUT */
        .profile-card { background: var(--card-bg); padding: 30px; border-radius: 20px; display: flex; align-items: center; gap: 20px; border: 1px solid var(--border-color); position:relative;}
        .pfp-wrap { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; cursor: pointer; position:relative; flex-shrink: 0;}
        .pfp-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .pfp-wrap .overlay { position: absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:0.2s; font-size:12px; font-weight:bold;}
        .pfp-wrap:hover .overlay { opacity:1; }
        
        .prof-info { display: flex; flex-direction: column; gap: 5px; flex:1;}
        .prof-name { font-size: 24px; font-weight: bold; display:flex; align-items:center; gap:10px;}
        .badge-vip { background: rgba(255,204,0,0.1); color: #ffcc00; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 1px solid #ffcc00;}
        .prof-stats { font-size: 13px; color: var(--text-muted); display:flex; gap:15px; margin-top:5px;}

        .btn-edit-name { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; display:flex; align-items:center; gap:5px;}
        .btn-edit-name:hover { background: rgba(255,255,255,0.1); }

        .stat-buttons { margin-top: 20px; display:flex; flex-direction:column; gap:10px; }
        .stat-row { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; align-items: center; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold;}
        .stat-row:hover { background: rgba(165,42,42,0.1); border-color: var(--accent-light); transform:translateX(5px);}
        .stat-badge { background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-left: auto; margin-right: 10px;}

        /* MY MUSIC VIEWS */
        .tabs-header { display:flex; gap:30px; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:10px;}
        .tab-btn { background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; padding:0; outline:none;}
        .tab-btn.active { color:var(--accent-light); font-weight:bold;}

        .lib-row { display: grid; grid-template-columns: 80px 3fr 100px 140px; padding: 16px; align-items: center; border-bottom: 1px solid var(--border-color); background: var(--card-bg); margin-bottom: 5px; border-radius: 12px;}
        .lib-cover { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-main); padding: 8px; border-radius: 8px; transition: 0.2s; display: inline-flex; align-items: center; text-decoration: none;}
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor;}

        /* VIP CENTER UPLOAD */
        .vip-upload-bar { display: flex; gap: 15px; margin-bottom: 20px; margin-top:30px;}
        .vip-btn-upload { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: white; padding: 20px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;}
        .vip-btn-upload:hover { border-color: var(--accent-light); background: rgba(165, 42, 42, 0.1); }

        .upload-tabs { display:flex; margin-bottom:15px; border-bottom:1px solid var(--border-color);}
        .upload-tabs button { flex:1; background:none; border:none; color:var(--text-muted); padding:10px; cursor:pointer; border-bottom:2px solid transparent; transition:0.2s;}
        .upload-tabs button.active { color:white; border-bottom-color:var(--accent-light); font-weight:bold;}
        .upload-dropzone { border:2px dashed var(--border-color); border-radius:12px; padding:40px 20px; text-align:center; color:var(--text-muted); cursor:pointer; background:rgba(0,0,0,0.2); transition:0.2s;}
        .upload-dropzone:hover { border-color:var(--accent-light); background:rgba(165,42,42,0.05); }

        .input-field { background: #111; color: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; font-size: 14px; outline: none; transition: 0.2s; width:100%; box-sizing:border-box;}
        .input-field:focus { border-color: var(--accent-light); }
        .btn-submit { background: linear-gradient(90deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s;}
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; color: white; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* REAL PROGRESS LOADER */
        #splashLoader { display:flex; position:fixed; inset:0; background:rgba(11, 11, 11, 0.8); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); z-index:9999999; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease; }
        .content-loader-bar-wrap { width:250px; height:6px; background:rgba(255,255,255,0.05); border-radius:4px; overflow:hidden; border:1px solid var(--border-color); margin-top:20px;}
        .loader-bar-fill { width:0%; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-light)); transition:width 0.1s linear; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px;}
        .modal-box { background: rgba(20, 10, 10, 0.95); width: 100%; max-width: 400px; border-radius: 20px; text-align: left; border: 1px solid var(--border-color); animation: popIn 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.8); padding:30px;}
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 768px) {
            .header-top { padding: 15px 20px; }
            .profile-card { flex-direction: column; text-align: center; }
            .btn-edit-name { margin: 10px auto 0 auto !important; }
            .prof-stats { justify-content: center; }
            .lib-row { grid-template-columns: 60px 1fr 50px; }
            .lib-row > div:nth-child(n+4) { display: none; }
        }
    </style>
</head>
<body>

<div id="splashLoader">
    <div style="font-size:14px; font-weight:bold; color:var(--text-muted); letter-spacing:2px;">努力加载中 >.<</div>
    <div class="content-loader-bar-wrap"><div id="initLoadBar" class="loader-bar-fill"></div></div>
</div>

<div id="vipUploadProgOverlay" class="modal-overlay" style="z-index:10005; flex-direction:column; background: rgba(0,0,0,0.8);">
    <div style="font-size:16px; margin-bottom:15px; color:var(--accent-light); font-weight:bold; letter-spacing:1px; animation: pulseFade 1s infinite;">努力上传歌曲 >w<</div>
    <div class="content-loader-bar-wrap" style="width: 250px;"><div id="vipUploadBarFill" class="loader-bar-fill" style="width:0%;"></div></div>
</div>

<div id="vipUploadSuccessOverlay" class="modal-overlay" style="z-index:10006; background: rgba(0,0,0,0.8); transition: opacity 0.5s;">
    <div style="font-size:18px; font-weight:bold; color:white;" id="vipSuccessText"></div>
</div>

<div id="toast" class="toast"></div>

<div class="header-top">
    <div class="logo-container">FULLKIK</div>
    <div class="header-right">
        <a href="/music.html" style="color:var(--text-muted); text-decoration:none; font-size:14px; font-weight:bold; padding:8px 16px; border-radius:20px; background:rgba(255,255,255,0.05);">返回首页</a>
    </div>
</div>

<div class="container">
    
    <div id="view-profile" class="view-section active">
        <div class="profile-card">
            <div class="pfp-wrap" onclick="document.getElementById('pfpUploadInput').click()">
                <img id="mainPfp" src="">
                <div class="overlay">EDIT</div>
            </div>
            <div class="prof-info">
                <div class="prof-name"><span id="mainUsername">User</span> <span id="vipBadge" class="badge-vip" style="display:none;">VIP</span></div>
                <div class="prof-stats"><span>💎 <span id="mainTokens">0</span></span> <span>关注 0</span> <span>粉丝 0</span></div>
            </div>
            <button class="btn-edit-name" onclick="openEditNameModal()"><svg viewBox="0 0 24 24" style="width:14px;fill:currentColor;"><path d="M19.14... (gear icon omitted for brevity)..."></path></svg> 修改名称</button>
        </div>

        <div class="stat-buttons">
            <div class="stat-row" onclick="openMyMusic('purchased')">
                🎵 已买歌曲 
                <span class="stat-badge" id="count-purchased">0</span> <span style="color:var(--text-muted)">></span>
            </div>
            <div class="stat-row" onclick="openMyMusic('favorites')">
                ❤️ 收藏歌曲 
                <span class="stat-badge" id="count-favorites">0</span> <span style="color:var(--text-muted)">></span>
            </div>
        </div>

        <div class="vip-upload-bar" id="vipUploadTools" style="display:none;">
            <button class="vip-btn-upload" onclick="openVipUpload()">↑ 上传音乐 (Upload MP3)</button>
        </div>
    </div>

    <div id="view-my-music" class="view-section">
        <h2 style="margin-top:0; margin-bottom:20px;">我的音乐</h2>
        <div class="tabs-header">
            <button class="tab-btn active" id="tab-purchased" onclick="renderMyMusic('purchased')">已购买</button>
            <button class="tab-btn" id="tab-favorites" onclick="renderMyMusic('favorites')">我的收藏</button>
        </div>
        <div id="myMusicList"></div>
    </div>

    <div id="view-vip-upload" class="view-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <div><h2 style="margin:0;" id="vipUpTitle">上传歌曲</h2><p style="margin:0; font-size:12px; color:var(--text-muted);">VIP 创作者上传歌曲到平台</p></div>
        </div>
        
        <div class="form-section" style="background:var(--card-bg);">
            <div style="font-size:14px; font-weight:bold; margin-bottom:20px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                歌曲信息 <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">默认免费上传，如需收费请在价格栏填入钻石数量。</span>
            </div>
            
            <label class="input-label" style="display:block;text-align:center;margin-bottom:5px;">封面图片</label>
            <div style="position: relative; width: 100px; height: 100px; margin: 0 auto 15px auto; cursor: pointer; border-radius: 8px; overflow:hidden; border:2px dashed var(--border-color);" onclick="document.getElementById('vipCoverUpload').click()">
                <img id="vipCoverPreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E" style="width: 100%; height: 100%; object-fit: cover;">
                <div style="position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.6); text-align: center; font-size: 10px; padding: 4px 0; color:white;">EDIT COVER</div>
            </div>
            <input type="file" id="vipCoverUpload" accept="image/*" style="display:none;" onchange="handleVipCover(event)">
            
            <div class="upload-tabs" id="vip-audio-tabs">
                <button class="active" id="vip-btn-file" onclick="setVipUploadMode(false)">上传文件</button>
                <button id="vip-btn-link" onclick="setVipUploadMode(true)">粘贴链接</button>
            </div>
            
            <div class="upload-dropzone" id="vip-audio-dropzone" onclick="document.getElementById('vipFileInput').click()" style="padding:20px; font-size:12px; margin-bottom:10px;">
                点击选择 MP3 / WAV
            </div>
            <input type="text" class="input-field" id="vipTransloadUrlInput" placeholder="转运歌曲 (粘贴 .m4a URL)" style="display:none; margin-bottom:10px;">
            <input type="file" id="vipFileInput" accept="audio/*,video/mp4,.m4a,.mp3" style="display:none;" onchange="handleVipAudioSelect(event)">
            <div id="vipFileCount" style="text-align:center; font-size:12px; color:var(--accent-light); margin-bottom:15px;"></div>

            <label style="font-size:12px; color:var(--text-muted);">歌曲标题 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="vipTitleInput" class="input-field" style="margin-bottom:10px;">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label style="font-size:12px; color:var(--text-muted);">价格 (钻石)</label>
                    <input type="number" id="vipPriceInput" class="input-field" value="0" min="0">
                </div>
                <div style="flex:1;">
                    <label style="font-size:12px; color:var(--text-muted);">分类选择</label>
                    <select id="vipGenreSelect" class="input-field" style="background:var(--bg-color); color:white;"></select>
                </div>
            </div>

            <div class="error-msg" id="vipErrRow" style="text-align:center; margin-top:10px;"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-submit" style="background:transparent; border:1px solid var(--border-color); color:var(--text-muted);" onclick="switchView('profile')">取消</button>
                <button class="btn-submit" onclick="executeVipUpload()" style="color:var(--text-main);">提交审核</button>
            </div>
        </div>
    </div>
</div>

<input type="file" id="pfpUploadInput" accept="image/*" style="display:none;" onchange="handlePfpSelect(event)">
<div class="modal-overlay" id="cropModal">
    <div class="modal-box" style="max-width:350px;">
        <h3 style="margin: 0 0 15px 0; text-align:center;">上传头像</h3>
        <canvas id="cropperCanvas" width="200" height="200" style="background:#000; border-radius:50%; border:2px dashed var(--accent); margin:0 auto; display:block;"></canvas>
        <div style="text-align:center; margin-top:15px;"><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="width:200px;"></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-submit" style="background:transparent; border:1px solid var(--border-color); color:var(--text-muted);" onclick="closeModals()">取消</button>
            <button class="btn-submit" onclick="executePfpCrop()">保存</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editNameModal">
    <div class="modal-box">
        <h3 style="margin: 0 0 15px 0;">修改名称</h3>
        <p style="font-size:12px; color:var(--text-muted);">全局唯一。此名称将用于展示您的档案和上传的歌曲。</p>
        <input type="text" id="newUsernameInput" class="input-field" placeholder="输入新名称">
        <div class="error-msg" id="editNameErr" style="margin-top:5px; text-align:center;"></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-submit" style="background:transparent; border:1px solid var(--border-color); color:var(--text-muted);" onclick="closeModals()">取消</button>
            <button class="btn-submit" onclick="submitNameChange()">保存</button>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let allGenres = [], allSongs = [], userPurchases = [], userFavorites = [];
    let userTokens = 0, isUserVip = false;
    const username = localStorage.getItem('djUsername');
    if(!username) window.location.href = '/register.html';
    
    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.className='toast'; if(isError) t.classList.add('shake'); t.innerText = msg; t.classList.add('show'); setTimeout(() => {t.classList.remove('show'); t.classList.remove('shake');}, 4000); }
    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => { if(m.id !== 'splashLoader' && m.id !== 'vipUploadProgOverlay' && m.id !== 'vipUploadSuccessOverlay') m.style.display = 'none'; }); }

    function switchView(view, tab = null) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const targetView = document.getElementById(`view-${view}`); if(targetView) targetView.classList.add('active');
        if(view === 'my-music' && tab) renderMyMusic(tab);
    }

    // --- INITIALIZATION (Real Progress Loader) ---
    async function init() {
        const bar = document.getElementById('initLoadBar');
        let p = 0; const sInt = setInterval(() => { p += Math.random()*15; if(p>90) p=90; bar.style.width = `${p}%`; }, 100);

        try {
            const uRes = await fetch(`${API_URL}/users/${username}`);
            if(uRes.ok) { 
                const data = await uRes.json(); 
                userTokens = data.tokens || 0; userPurchases = data.purchases || []; userFavorites = data.favorites || []; isUserVip = data.isVip || false;
                
                const pfpUrl = data.profilePic || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                document.getElementById('mainPfp').src = pfpUrl; 
                document.getElementById('mainUsername').innerText = username;
                document.getElementById('mainTokens').innerText = userTokens;
                document.getElementById('count-purchased').innerText = userPurchases.length;
                document.getElementById('count-favorites').innerText = userFavorites.length;
                
                if(isUserVip) {
                    document.getElementById('vipBadge').style.display = 'inline-block';
                    document.getElementById('vipUploadTools').style.display = 'flex';
                    document.getElementById('vipUploaderInput').value = username;
                }
            } else { localStorage.removeItem('djUsername'); window.location.href = '/register.html'; }
            
            allGenres = await (await fetch(`${API_URL}/genres`)).json();
            allSongs = await (await fetch(`${API_URL}/songs`)).json();
            
            populateGenreDropdowns();
        } catch(e) { console.error("Init Error:", e); } 

        clearInterval(sInt); bar.style.width = '100%';
        setTimeout(() => { document.getElementById('splashLoader').style.display = 'none'; }, 500);
    }

    // --- CROPPER ---
    let cropImg = new Image(), cropCanvas = document.getElementById('cropperCanvas'), ctx = cropCanvas ? cropCanvas.getContext('2d') : null;
    let offsetX = 0, offsetY = 0, isDragging = false, startX, startY;
    function handlePfpSelect(event) { const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (e) => { cropImg.src = e.target.result; cropImg.onload = () => { offsetX=0; offsetY=0; document.getElementById('cropZoom').value = 1; drawCrop(); document.getElementById('cropModal').style.display='flex'; }; }; reader.readAsDataURL(file); }
    function drawCrop() { if(!ctx) return; ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height); const zoom = parseFloat(document.getElementById('cropZoom').value); const minScale = Math.max(cropCanvas.width/cropImg.width, cropCanvas.height/cropImg.height); const scale = minScale * zoom; const w = cropImg.width * scale; const h = cropImg.height * scale; if(offsetX > 0) offsetX = 0; if(offsetY > 0) offsetY = 0; if(w + offsetX < cropCanvas.width) offsetX = cropCanvas.width - w; if(h + offsetY < cropCanvas.height) offsetY = cropCanvas.height - h; ctx.drawImage(cropImg, offsetX, offsetY, w, h); }
    if(document.getElementById('cropZoom')) {
        document.getElementById('cropZoom').addEventListener('input', drawCrop);
        cropCanvas.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - offsetX; startY = e.clientY - offsetY; }); cropCanvas.addEventListener('mousemove', e => { if(!isDragging) return; offsetX = e.clientX - startX; offsetY = e.clientY - startY; drawCrop(); }); cropCanvas.addEventListener('mouseup', () => { isDragging = false; }); cropCanvas.addEventListener('mouseleave', () => { isDragging = false; });
        cropCanvas.addEventListener('touchstart', e => { isDragging = true; startX = e.touches[0].clientX - offsetX; startY = e.touches[0].clientY - offsetY; }); cropCanvas.addEventListener('touchmove', e => { if(!isDragging) return; e.preventDefault(); offsetX = e.touches[0].clientX - startX; offsetY = e.touches[0].clientY - startY; drawCrop(); }, {passive: false}); cropCanvas.addEventListener('touchend', () => { isDragging = false; });
    }

    async function executePfpCrop() {
        document.getElementById('cropModal').style.display='none'; const base64 = cropCanvas.toDataURL('image/jpeg', 0.9);
        const res = await fetch(`${API_URL}/users/${username}/profile-pic`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ imageBase64: base64 }) });
        if(res.ok) { document.getElementById('mainPfp').src = base64; showToast("Profile Updated"); }
    }

    // --- EDIT NAME ---
    function openEditNameModal() { document.getElementById('newUsernameInput').value = username; document.getElementById('editNameErr').innerText = ''; document.getElementById('editNameModal').style.display = 'flex'; }
    async function submitNameChange() {
        const nu = document.getElementById('newUsernameInput').value.trim();
        if(!nu || nu === username) return closeModals();
        const res = await fetch(`${API_URL}/users/${username}/change-username`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ newUsername: nu }) });
        if(res.ok) { localStorage.setItem('djUsername', nu); window.location.reload(); } else { document.getElementById('editNameErr').innerText = await res.text(); }
    }

    // --- MY MUSIC VIEW ---
    function openMyMusic(tab) { switchView('my-music', tab); }
    function renderMyMusic(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        const listDiv = document.getElementById('myMusicList'); listDiv.innerHTML = '';
        
        if(tab === 'purchased') {
            if(userPurchases.length === 0) { listDiv.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:40px;">暂无记录 (No Records)</p>`; return; }
            userPurchases.forEach(p => {
                const cover = p.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                listDiv.innerHTML += `
                    <div class="lib-row">
                        <img src="${cover}" class="lib-cover">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight: 500;">${p.songName}</div>
                            <div class="truncate" style="font-size:11px;color:var(--text-muted);">Uploader: ${p.uploader||'FULLKIK'}</div>
                        </div>
                        <div style="color: var(--token); font-weight: bold;">💎 ${p.tokensSpent}</div>
                        <div style="display:flex; align-items:center; gap: 5px;">
                            <a href="/api/stream/${p.songId}" download="${p.songName}" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></a>
                        </div>
                    </div>`;
            });
        } else if(tab === 'favorites') {
            if(userFavorites.length === 0) { listDiv.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:40px;">暂无收藏 (No Favorites)</p>`; return; }
            userFavorites.forEach(id => {
                const s = allSongs.find(song => song.id === id); if(!s) return;
                const cover = s.coverUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
                listDiv.innerHTML += `
                    <div class="lib-row">
                        <img src="${cover}" class="lib-cover">
                        <div style="min-width:0;">
                            <div class="truncate" style="font-weight: 500;">${s.filename}</div>
                            <div class="truncate" style="font-size:11px;color:var(--text-muted);">👑 ${s.uploader||'FULLKIK'}</div>
                        </div>
                        <div style="color: var(--token); font-weight: bold;">💎 ${s.price||0}</div>
                        <div style="display:flex; align-items:center; gap: 5px;">
                            <button class="icon-btn" style="color:var(--danger);" onclick="unfavoriteSong('${s.id}')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
                        </div>
                    </div>`;
            });
        }
    }

    async function unfavoriteSong(songId) {
        userFavorites = userFavorites.filter(id => id !== songId); document.getElementById('count-favorites').innerText = userFavorites.length; renderMyMusic('favorites');
        await fetch(`${API_URL}/users/${username}/toggle-favorite`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ songId }) });
    }

    // --- VIP CENTER UPLOAD ---
    function populateGenreDropdowns() { const uploadSel = document.getElementById('vipGenreSelect'); if(uploadSel) { uploadSel.innerHTML = ''; allGenres.forEach(g => { if(g.status !== 'DISABLED') uploadSel.innerHTML += `<option value="${g.id}">${g.name}</option>`; }); } }

    let pendingVipCover = null; let isVipTransload = false;
    function setVipUploadMode(isTransload) {
        isVipTransload = isTransload;
        document.getElementById('vip-btn-file').classList.toggle('active', !isTransload); document.getElementById('vip-btn-link').classList.toggle('active', isTransload);
        document.getElementById('vip-audio-dropzone').style.display = isTransload ? 'none' : 'block'; document.getElementById('vipFileCount').style.display = isTransload ? 'none' : 'block'; document.getElementById('vipTransloadUrlInput').style.display = isTransload ? 'block' : 'none';
    }

    function handleVipAudioSelect(e) { const file = e.target.files[0]; if(file) { document.getElementById('vipFileCount').innerText = file.name; document.getElementById('vipTitleInput').value = file.name.replace(/\.[^/.]+$/, ""); } }
    function handleVipCover(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(ev) { pendingVipCover = ev.target.result; document.getElementById('vipCoverPreview').src = pendingVipCover; }; reader.readAsDataURL(file); }

    function openVipUpload() {
        pendingVipCover = null; document.getElementById('vipCoverPreview').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a0f0f'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🎧%3C/text%3E%3C/svg%3E";
        document.getElementById('vipTitleInput').value = ''; document.getElementById('vipPriceInput').value = '0'; document.getElementById('vipErrRow').innerText = ''; document.getElementById('vipTransloadUrlInput').value = '';
        document.getElementById('vipFileCount').innerText = ''; document.getElementById('vipFileInput').value = '';
        setVipUploadMode(false); switchView('vip-upload');
    }

    async function executeVipUpload() {
        const titleBase = document.getElementById('vipTitleInput').value.trim(); const price = document.getElementById('vipPriceInput').value; const genreId = document.getElementById('vipGenreSelect').value;
        const errRow = document.getElementById('vipErrRow'); errRow.innerText = '';
        if(!titleBase) return errRow.innerText = "请输入歌曲标题 (Title is required)";

        document.getElementById('vipUploadProgOverlay').style.display = 'flex';
        let p = 0; const bF = document.getElementById('vipUploadBarFill'); bF.style.width = '0%';
        const pInt = setInterval(() => { p += Math.random()*10; if(p>90) p=90; bF.style.width = `${p}%`; }, 100);

        if(isVipTransload) {
            const urlInput = document.getElementById('vipTransloadUrlInput'); const url = urlInput.value.trim();
            if(!url.startsWith('http') || !url.includes('.m4a')) { clearInterval(pInt); document.getElementById('vipUploadProgOverlay').style.display = 'none'; urlInput.classList.add('shake'); setTimeout(() => urlInput.classList.remove('shake'), 200); return errRow.innerText = "Invalid URL or not .m4a"; }
            const payload = { url, title: titleBase, price, genreId, uploader: username, status: 'PENDING', coverBase64: pendingVipCover };
            await fetch(`${API_URL}/transload`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        } else {
            const file = document.getElementById('vipFileInput').files[0];
            if(!file) { clearInterval(pInt); document.getElementById('vipUploadProgOverlay').style.display = 'none'; return errRow.innerText = "Please select a file."; }
            const fd = new FormData(); fd.append('mp3file', file); fd.append('title', titleBase); fd.append('price', price); fd.append('genreId', genreId); fd.append('uploader', username); fd.append('status', 'PENDING');  
            if(pendingVipCover) fd.append('coverBase64', pendingVipCover);
            await fetch(`${API_URL}/upload`, { method: 'POST', body: fd });
        }

        clearInterval(pInt); bF.style.width = '100%';
        setTimeout(() => {
            document.getElementById('vipUploadProgOverlay').style.display = 'none';
            document.getElementById('vipSuccessText').innerText = "提交成功 请等待 1-3 天审核时间.";
            const sucOver = document.getElementById('vipUploadSuccessOverlay');
            sucOver.style.opacity = 1; sucOver.style.display = 'flex';
            setTimeout(() => { sucOver.style.opacity = 0; setTimeout(() => { sucOver.style.display = 'none'; switchView('profile'); }, 500); }, 3000);
        }, 300);
    }

    document.addEventListener("DOMContentLoaded", () => { init(); });
</script>
</body>
</html>
